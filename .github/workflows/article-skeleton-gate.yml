name: Article skeleton gate

# Cycle #74 (2026-10-07): artikel yang di-commit LANGSUNG (tanpa publish-scheduled.yml),
# seperti batch MinTiv 2026-10-06, tidak pernah melewati gate kerangka. Workflow ini
# memeriksa setiap push yang menyentuh artikel/ atau blog.html. Merah = ada artikel
# baru yang menyimpang dari kerangka kanonik; bungkus ulang lewat
# scripts/lib/article-page.js (renderArticlePage), jangan longgarkan validatornya.

on:
  push:
    branches: [main]
    paths:
      - 'artikel/**'
      - 'blog.html'
      - 'scripts/lib/article-*.js'
      - 'scripts/check-article-*.js'
      - 'publish-schedule.json'
      - 'scripts/daily-cap.js'
      - 'scripts/check-inline-image-crop.js'
      - 'assets/css/**'
  pull_request:
    paths:
      - 'artikel/**'
  workflow_dispatch:

jobs:
  skeleton:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Footer, GA4, analytics
        run: node scripts/check-article-shell.js
      # Batas keras Syauqi 2026-10-19: maksimal 3 artikel per datePublished (tayang + antrean).
      # 11, 12, 16 dan 17 Okt 2026 berisi 14/7/6/4 karena batch agen di-commit langsung.
      - name: Maksimal 3 artikel per tanggal terbit
        run: node scripts/daily-cap.js check
      - name: Kerangka kanonik artikel sejak 2026-10-03
        run: node scripts/check-article-skeleton.js --since=2026-10-03
      # Gate crop gambar isi (cycle 80, 2026-10-19): foto potret di isi artikel sempat
      # dipaksa ke kotak lanskap 752x560 (object-fit: cover). Gambar isi wajib utuh;
      # crop hanya untuk hero dan kartu. Merah = perbaiki EXTRA_CSS di scripts/lib/article-page.js.
      - name: Gambar isi artikel tidak dipotong
        run: node scripts/check-inline-image-crop.js
      # Gate mutu konten (2026-10-09): artikel BARU (datePublished >= 2026-10-10) wajib
      # >= 2000 kata, >= 4 gambar isi, >= 7 FAQ + FAQPage schema, >= 1 tabel. Merah = perluas
      # artikelnya (scripts/lib/article-quality.js), jangan longgarkan angkanya.
      # Gate anti-duplikat (2026-10-11, Trello gswe5XFa): 3 Okt 2026, 11 artikel baru tayang
      # dengan judul baru tetapi badan salinan artikel lain. Seluruh folder diperiksa, merah
      # kalau ada pasangan Jaccard >= 0,70 atau containment >= 0,85 (shingle 8 kata).
      - name: Anti-duplikat badan artikel
        run: node scripts/check-article-duplicates.js --all
      - name: Mutu konten artikel baru sejak 2026-10-10
        run: node scripts/check-article-quality.js --since=2026-10-10
      # Utang artikel lama: dilaporkan saja, tidak memblok.
      - name: Laporan utang mutu artikel lama (tidak memblok)
        run: node scripts/check-article-quality.js --all --warn-only | tail -n 3
