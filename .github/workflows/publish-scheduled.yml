name: Publish Scheduled Articles

on:
  schedule:
    # Run daily at 02:00 UTC (09:00 WIB)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check and publish scheduled articles
        id: publish
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          echo "Today: $TODAY"

          if [ ! -f publish-schedule.json ]; then
            echo "No schedule file found."
            echo "published=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if there are articles to publish today
          ARTICLES=$(python3 -c "
          import json, sys
          with open('publish-schedule.json') as f:
              schedule = json.load(f)
          today_articles = [a for a in schedule if a['date'] <= '$TODAY']
          if not today_articles:
              print('NONE')
              sys.exit(0)
          for a in today_articles:
              print(f\"{a['slug']}|{a['file']}|{a['title']}|{a['description']}|{a['image']}|{a['category']}|{a['readTime']}|{a['date']}\")
          ")

          if [ "$ARTICLES" = "NONE" ]; then
            echo "No articles scheduled for today or earlier."
            echo "published=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Articles to publish:"
          echo "$ARTICLES"
          echo "published=true" >> $GITHUB_OUTPUT

          # Collect published article info for email
          EMAIL_ROWS=""

          # Process each article
          while IFS='|' read -r slug file title desc image category readtime pubdate; do
            echo "Publishing: $title ($slug)"

            # Format date for display (e.g., "18 Mar 2026")
            DISPLAY_DATE=$(date -d "$pubdate" +"%d %b %Y" 2>/dev/null || date -j -f "%Y-%m-%d" "$pubdate" +"%d %b %Y" 2>/dev/null || echo "$pubdate")

            # Append to email rows
            EMAIL_ROWS="${EMAIL_ROWS}<tr><td style='padding:16px;border-bottom:1px solid #eee'><strong style='font-size:16px'>${title}</strong><br><small style='color:#666'>Kategori: ${category} | ${readtime} | ${DISPLAY_DATE}</small><br><span style='color:#555;font-size:13px'>${desc}</span><br><a href='https://www.yukaindonesia.com/artikel/${slug}' style='display:inline-block;margin-top:8px;padding:8px 16px;background:#2e7d32;color:#ffffff;text-decoration:none;border-radius:4px;font-size:13px;font-weight:bold'>Baca Artikel &rarr;</a></td></tr>"

            # Create blog card HTML. Use the clean URL path in blog links even
            # when the schedule entry keeps the physical .html file path.
            CLEAN_FILE="artikel/$slug"
            CARD="                <!-- Article: $title -->
                          <article class=\"card blog-card animate-on-scroll\">
                              <div class=\"card-image\">
                                  <img src=\"$image\" alt=\"$title\" loading=\"lazy\">
                              </div>
                              <div class=\"card-body\">
                                  <span class=\"card-category\">$category</span>
                                  <h3 class=\"card-title\">
                                      <a href=\"$CLEAN_FILE\">$title</a>
                                  </h3>
                                  <p class=\"card-text\">$desc</p>
                                  <div class=\"card-meta\">
                                      <span>
                                          <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">
                                              <rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\" ry=\"2\"/>
                                              <line x1=\"16\" y1=\"2\" x2=\"16\" y2=\"6\"/>
                                              <line x1=\"8\" y1=\"2\" x2=\"8\" y2=\"6\"/>
                                              <line x1=\"3\" y1=\"10\" x2=\"21\" y2=\"10\"/>
                                          </svg>
                                          $DISPLAY_DATE
                                      </span>
                                      <span>
                                          <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">
                                              <path d=\"M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z\"/>
                                          </svg>
                                          $readtime
                                      </span>
                                  </div>
                              </div>
                          </article>"

            # Insert card after blog-grid opening div in blog.html
            python3 -c "
          import re
          with open('blog.html', 'r') as f:
              content = f.read()
          marker = '<div class=\"blog-grid\" id=\"blogGrid\">'
          if marker in content:
              card = '''$CARD'''
              content = content.replace(marker, marker + '\n' + card, 1)
              # Update article count
              content = re.sub(r'Menampilkan \d+ artikel', lambda m: f\"Menampilkan {int(re.search(r'\d+', m.group()).group()) + 1} artikel\", content)
              with open('blog.html', 'w') as f:
                  f.write(content)
              print(f'Added to blog.html: $slug')
          "

            # Add to sitemap.xml (clean URL: www + no .html)
            CLEAN_URL="https://www.yukaindonesia.com/artikel/$slug"
            python3 -c "
          with open('sitemap.xml', 'r') as f:
              content = f.read()
          clean_url = 'https://www.yukaindonesia.com/artikel/$slug'
          entry = '''    <url>
              <loc>''' + clean_url + '''</loc>
              <lastmod>$pubdate</lastmod>
              <changefreq>monthly</changefreq>
              <priority>0.8</priority>
          </url>'''
          if clean_url not in content:
              content = content.replace('</urlset>', entry + '\n</urlset>')
              with open('sitemap.xml', 'w') as f:
                  f.write(content)
              print(f'Added to sitemap.xml: $slug')
          "

          done <<< "$ARTICLES"

          # Keep split sitemaps and the main sitemap in sync after scheduled publish.
          node scripts/regen-sitemaps.js

          # Count published
          PUBLISHED_COUNT=$(echo "$ARTICLES" | wc -l)
          echo "published_count=$PUBLISHED_COUNT" >> $GITHUB_OUTPUT

          # Remove published articles from schedule and get remaining count
          REMAINING_COUNT=$(python3 -c "
          import json
          with open('publish-schedule.json') as f:
              schedule = json.load(f)
          remaining = [a for a in schedule if a['date'] > '$TODAY']
          with open('publish-schedule.json', 'w') as f:
              json.dump(remaining, f, indent=2, ensure_ascii=False)
          published = len(schedule) - len(remaining)
          print(len(remaining))
          ")
          echo "Published $PUBLISHED_COUNT articles, $REMAINING_COUNT remaining."

          # Build full email HTML and save to output
          {
            echo "email_html<<ENDOFHTML"
            cat <<EMAILEOF
          <!DOCTYPE html>
          <html>
          <head><meta charset="UTF-8"></head>
          <body style="font-family:Arial,sans-serif;max-width:600px;margin:0 auto;padding:20px">
            <div style="background:#2e7d32;color:white;padding:20px;border-radius:8px 8px 0 0;text-align:center">
              <h2 style="margin:0">Artikel YUKA Baru Tayang!</h2>
              <p style="margin:5px 0 0;opacity:0.9">${PUBLISHED_COUNT} artikel berhasil dipublikasikan</p>
            </div>
            <div style="border:1px solid #ddd;border-top:none;padding:20px;border-radius:0 0 8px 8px">
              <p>Halo Kak Syauqi,</p>
              <p>Berikut artikel yang baru saja dipublikasikan di <a href="https://yukaindonesia.com/blog.html" style="color:#2e7d32">yukaindonesia.com</a>:</p>
              <table style="width:100%;border-collapse:collapse;margin:15px 0">
                <tbody>
                  ${EMAIL_ROWS}
                </tbody>
              </table>
              <p style="color:#666;font-size:13px">
                Sisa artikel terjadwal: <strong>${REMAINING_COUNT}</strong> artikel
              </p>
              <hr style="border:none;border-top:1px solid #eee;margin:20px 0">
              <p style="color:#999;font-size:12px;text-align:center">
                Email otomatis dari GitHub Actions | <a href="https://yukaindonesia.com" style="color:#2e7d32">YUKA Indonesia</a>
              </p>
            </div>
          </body>
          </html>
          EMAILEOF
            echo "ENDOFHTML"
          } >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.publish.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog.html sitemap.xml sitemap-pages.xml sitemap-articles.xml publish-schedule.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Auto-publish scheduled articles for $(date -u +%Y-%m-%d)"
          git push

      - name: Send email notification
        if: steps.publish.outputs.published == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "[YUKA] Artikel Baru Tayang - ${{ steps.publish.outputs.published_count }} artikel dipublikasikan"
          to: ahmadthariqsyauqi@gmail.com
          from: YUKA Auto-Publisher <noreply@yukaindonesia.com>
          html_body: ${{ steps.publish.outputs.email_html }}
