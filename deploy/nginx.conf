server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Microsoft Clarity session recording (zi57k54b3u), disuntik ke semua halaman HTML
    sub_filter '</head>' '<script type="text/javascript">(function(c,l,a,r,i,t,y){c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);})(window, document, "clarity", "script", "zi57k54b3u");</script></head>';
    sub_filter_once on;
    sub_filter_last_modified on;
    absolute_redirect off;
    port_in_redirect off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    error_page 404 /404.html;
    # exact-match wins over the .html-stripping regex below, so the 404 body is
    # served internally instead of being turned into a 301 (the old soft-404 bug)
    location = /404.html { internal; }
    location = /404 { return 404; }

    # Internal working folders. The whole repo is served as static files, so every
    # committed file under these paths was publicly readable: keyword research,
    # GSC exports, audit reports, and build scripts. Verified 2026-09-11 that
    # /seo/cannibal-decisions.md and /scripts/regen-sitemaps.js both answered 200.
    # `^~` is required, not `~`: a plain prefix location loses to the .html regex
    # below, so /seo/report-....html would still be rewritten instead of blocked.
    # None of these paths is referenced by any page, stylesheet, script, or sitemap.
    location ^~ /seo/ { return 404; }
    location ^~ /data/ { return 404; }
    location ^~ /scripts/ { return 404; }
    location ^~ /reports/ { return 404; }
    location ^~ /report-assets/ { return 404; }
    location ^~ /tools/ { return 404; }
    location ^~ /tmp/ { return 404; }
    location ^~ /temp/ { return 404; }
    location ^~ /graphify-out/ { return 404; }
    location ~ /\. { return 404; }

    location = /index.html { return 301 /; }
    # Send legacy .html URLs straight to the canonical www clean URL. The
    # absolute destination avoids a second host-canonicalization hop when an
    # old link is opened on the apex domain.
    location ~ ^/(?<base>.+)\.html$ { return 301 https://www.yukaindonesia.com/$base; }
    location / { try_files $uri $uri.html $uri/index.html =404; }
}
