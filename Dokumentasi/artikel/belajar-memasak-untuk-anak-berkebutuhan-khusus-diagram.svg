<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Tangga tugas dapur"><rect width="1200" height="600" fill="#F7F9FF"/><text x="60" y="70" font-family="Poppins,Arial,sans-serif" font-size="34" font-weight="700" fill="#2B3A67">Tangga tugas dapur</text><text x="60" y="108" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#4A5578">Mulai dari tugas tanpa panas dan tanpa benda tajam, naik bertahap sesuai kemampuan</text><rect x="60" y="330" width="201.6" height="220" rx="16" fill="#3C4F86"/><circle cx="94" cy="366" r="20" fill="#FFD700"/><text x="94" y="374" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-size="22" font-weight="700" fill="#2B3A67">1</text><text x="76" y="418" font-family="Poppins,Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Mencuci buah</text><text x="76" y="446" font-family="Poppins,Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">dan sayur</text><text x="76" y="482" font-family="Poppins,Arial,sans-serif" font-size="17" fill="#E6EBFA">Air, saringan, lap</text><rect x="279.6" y="285" width="201.6" height="265" rx="16" fill="#2B3A67"/><circle cx="313.6" cy="321" r="20" fill="#FFD700"/><text x="313.6" y="329" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-size="22" font-weight="700" fill="#2B3A67">2</text><text x="295.6" y="373" font-family="Poppins,Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Menakar dan</text><text x="295.6" y="401" font-family="Poppins,Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">menuang</text><text x="295.6" y="437" font-family="Poppins,Arial,sans-serif" font-size="17" fill="#E6EBFA">Gelas ukur, sendok</text><text x="295.6" y="461" font-family="Poppins,Arial,sans-serif" font-size="17" fill="#E6EBFA">takar</text><rect x="499.2" y="240" width="201.6" height="310" rx="16" fill="#3C4F86"/><circle cx="533.2" cy="276" r="20" fill="#FFD700"/><text x="533.2" y="284" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-size="22" font-weight="700" fill="#2B3A67">3</text><text x="515.2" y="328" font-family="Poppins,Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Mengaduk dan</text><text x="515.2" y="356" font-family="Poppins,Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">mencampur</text><text x="515.2" y="392" font-family="Poppins,Arial,sans-serif" font-size="17" fill="#E6EBFA">Mangkuk besar,</text><text x="515.2" y="416" font-family="Poppins,Arial,sans-serif" font-size="17" fill="#E6EBFA">spatula</text><rect x="718.8" y="195" width="201.6" height="355" rx="16" fill="#2B3A67"/><circle cx="752.8" cy="231" r="20" fill="#FFD700"/><text x="752.8" y="239" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-size="22" font-weight="700" fill="#2B3A67">4</text><text x="734.8" y="283" font-family="Poppins,Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Memotong</text><text x="734.8" y="311" font-family="Poppins,Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">dengan pisau</text><text x="734.8" y="339" font-family="Poppins,Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">aman</text><text x="734.8" y="375" font-family="Poppins,Arial,sans-serif" font-size="17" fill="#E6EBFA">Bahan lunak, alas</text><text x="734.8" y="399" font-family="Poppins,Arial,sans-serif" font-size="17" fill="#E6EBFA">anti selip</text><rect x="938.4" y="150" width="201.6" height="400" rx="16" fill="#3C4F86"/><circle cx="972.4" cy="186" r="20" fill="#FFD700"/><text x="972.4" y="194" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-size="22" font-weight="700" fill="#2B3A67">5</text><text x="954.4" y="238" font-family="Poppins,Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Memasak di</text><text x="954.4" y="266" font-family="Poppins,Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">kompor</text><text x="954.4" y="302" font-family="Poppins,Arial,sans-serif" font-size="17" fill="#E6EBFA">Selalu dengan</text><text x="954.4" y="326" font-family="Poppins,Arial,sans-serif" font-size="17" fill="#E6EBFA">pendamping</text><text x="1140" y="576" text-anchor="end" font-family="Poppins,Arial,sans-serif" font-size="16" fill="#6B7390">Diagram: Tim YUKA, yukaindonesia.com</text></svg>