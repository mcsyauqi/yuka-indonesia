<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Daftar periksa karyawisata inklusif"><rect width="1200" height="640" fill="#F7F9FF"/><text x="60" y="70" font-family="Poppins,Arial,sans-serif" font-size="34" font-weight="700" fill="#2B3A67">Daftar periksa karyawisata inklusif</text><text x="60" y="108" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#4A5578">Empat fase yang perlu direncanakan guru bersama orang tua</text><rect x="60" y="140" width="520" height="210" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/><rect x="60" y="140" width="12" height="210" rx="6" fill="#FFD700"/><text x="96" y="192" font-family="Poppins,Arial,sans-serif" font-size="26" font-weight="700" fill="#2B3A67">Sebelum berangkat</text><text x="96" y="232" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#333">Survei lokasi, cerita sosial bergambar,</text><text x="96" y="262" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#333">data kesehatan, izin orang tua,</text><text x="96" y="292" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#333">pembagian kelompok kecil.</text><rect x="620" y="140" width="520" height="210" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/><rect x="620" y="140" width="12" height="210" rx="6" fill="#FFD700"/><text x="656" y="192" font-family="Poppins,Arial,sans-serif" font-size="26" font-weight="700" fill="#2B3A67">Di perjalanan</text><text x="656" y="232" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#333">Tempat duduk yang disepakati, bekal,</text><text x="656" y="262" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#333">kegiatan pengisi, dan jeda bila anak</text><text x="656" y="292" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#333">mulai gelisah.</text><rect x="60" y="380" width="520" height="210" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/><rect x="60" y="380" width="12" height="210" rx="6" fill="#FFD700"/><text x="96" y="432" font-family="Poppins,Arial,sans-serif" font-size="26" font-weight="700" fill="#2B3A67">Di lokasi</text><text x="96" y="472" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#333">Titik kumpul jelas, tanda pengenal,</text><text x="96" y="502" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#333">jadwal bergambar, dan ruang tenang untuk</text><text x="96" y="532" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#333">menenangkan diri.</text><rect x="620" y="380" width="520" height="210" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/><rect x="620" y="380" width="12" height="210" rx="6" fill="#FFD700"/><text x="656" y="432" font-family="Poppins,Arial,sans-serif" font-size="26" font-weight="700" fill="#2B3A67">Sesudah pulang</text><text x="656" y="472" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#333">Bercerita lewat foto, catat apa yang</text><text x="656" y="502" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#333">berhasil, dan evaluasi untuk kunjungan</text><text x="656" y="532" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#333">berikutnya.</text><text x="1140" y="616" text-anchor="end" font-family="Poppins,Arial,sans-serif" font-size="16" fill="#6B7390">Diagram: Tim YUKA, yukaindonesia.com</text></svg>