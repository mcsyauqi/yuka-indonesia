<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Contoh aturan dapur"><rect width="1200" height="600" fill="#F7F9FF"/><text x="60" y="70" font-family="Poppins,Arial,sans-serif" font-size="34" font-weight="700" fill="#2B3A67">Contoh aturan dapur</text><text x="60" y="108" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#4A5578">Singkat dan bergambar, lalu ditempel di dinding dapur</text><rect x="60" y="150" width="530" height="185" rx="16" fill="#3C4F86"/><circle cx="110" cy="242" r="26" fill="#FFD700"/><text x="110" y="251" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-size="26" font-weight="700" fill="#2B3A67">1</text><text x="160" y="216" font-family="Poppins,Arial,sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">Cuci tangan dulu</text><text x="160" y="254" font-family="Poppins,Arial,sans-serif" font-size="26" fill="#FFFFFF">sebelum menyentuh</text><text x="160" y="290" font-family="Poppins,Arial,sans-serif" font-size="26" fill="#FFFFFF">bahan apa pun</text><rect x="610" y="150" width="530" height="185" rx="16" fill="#2B3A67"/><circle cx="660" cy="242" r="26" fill="#FFD700"/><text x="660" y="251" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-size="26" font-weight="700" fill="#2B3A67">2</text><text x="710" y="216" font-family="Poppins,Arial,sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">Pisau selalu</text><text x="710" y="254" font-family="Poppins,Arial,sans-serif" font-size="26" fill="#FFFFFF">menghadap</text><text x="710" y="290" font-family="Poppins,Arial,sans-serif" font-size="26" fill="#FFFFFF">ke bawah</text><rect x="60" y="355" width="530" height="185" rx="16" fill="#3C4F86"/><circle cx="110" cy="447" r="26" fill="#FFD700"/><text x="110" y="456" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-size="26" font-weight="700" fill="#2B3A67">3</text><text x="160" y="421" font-family="Poppins,Arial,sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">Gagang panci tidak</text><text x="160" y="459" font-family="Poppins,Arial,sans-serif" font-size="26" fill="#FFFFFF">menjorok ke luar</text><text x="160" y="495" font-family="Poppins,Arial,sans-serif" font-size="26" fill="#FFFFFF">meja</text><rect x="610" y="355" width="530" height="185" rx="16" fill="#2B3A67"/><circle cx="660" cy="447" r="26" fill="#FFD700"/><text x="660" y="456" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-size="26" font-weight="700" fill="#2B3A67">4</text><text x="710" y="421" font-family="Poppins,Arial,sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">Kompor hanya</text><text x="710" y="459" font-family="Poppins,Arial,sans-serif" font-size="26" fill="#FFFFFF">dinyalakan orang dewasa</text><text x="710" y="495" font-family="Poppins,Arial,sans-serif" font-size="26" fill="#FFFFFF">atau bersama orang dewasa</text></svg>
