<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Ide kegiatan Hari Disabilitas Internasional di sekolah"><rect width="1200" height="640" fill="#F7F9FF"/><text x="60" y="70" font-family="Poppins,Arial,sans-serif" font-size="34" font-weight="700" fill="#2B3A67">Ide kegiatan Hari Disabilitas Internasional di sekolah</text><text x="60" y="108" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#4A5578">Pilih kegiatan yang melibatkan siswa dengan disabilitas sebagai pelaku, bukan tontonan</text><rect x="60" y="140" width="520" height="210" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/><rect x="60" y="140" width="12" height="210" rx="6" fill="#FFD700"/><text x="96" y="192" font-family="Poppins,Arial,sans-serif" font-size="26" font-weight="700" fill="#2B3A67">Belajar bersama</text><text x="96" y="232" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#333">Kenalkan bahasa isyarat dasar, huruf</text><text x="96" y="262" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#333">braille, atau cara memandu teman</text><text x="96" y="292" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#333">tunanetra.</text><rect x="620" y="140" width="520" height="210" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/><rect x="620" y="140" width="12" height="210" rx="6" fill="#FFD700"/><text x="656" y="192" font-family="Poppins,Arial,sans-serif" font-size="26" font-weight="700" fill="#2B3A67">Audit aksesibilitas</text><text x="656" y="232" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#333">Siswa memetakan tangga, toilet, dan</text><text x="656" y="262" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#333">jalur di sekolah, lalu mengusulkan</text><text x="656" y="292" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#333">perbaikan.</text><rect x="60" y="380" width="520" height="210" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/><rect x="60" y="380" width="12" height="210" rx="6" fill="#FFD700"/><text x="96" y="432" font-family="Poppins,Arial,sans-serif" font-size="26" font-weight="700" fill="#2B3A67">Pentas karya</text><text x="96" y="472" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#333">Pameran gambar, musik, atau tari yang</text><text x="96" y="502" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#333">direncanakan bersama semua siswa.</text><rect x="620" y="380" width="520" height="210" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/><rect x="620" y="380" width="12" height="210" rx="6" fill="#FFD700"/><text x="656" y="432" font-family="Poppins,Arial,sans-serif" font-size="26" font-weight="700" fill="#2B3A67">Olahraga inklusif</text><text x="656" y="472" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#333">Permainan yang aturannya disesuaikan</text><text x="656" y="502" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#333">agar setiap siswa bisa ikut bermain.</text><text x="1140" y="616" text-anchor="end" font-family="Poppins,Arial,sans-serif" font-size="16" fill="#6B7390">Diagram: Tim YUKA, yukaindonesia.com</text></svg>