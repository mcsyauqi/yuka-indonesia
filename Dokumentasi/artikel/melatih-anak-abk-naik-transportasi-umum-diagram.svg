<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Tangga latihan naik transportasi umum"><rect width="1200" height="600" fill="#F7F9FF"/><text x="60" y="70" font-family="Poppins,Arial,sans-serif" font-size="34" font-weight="700" fill="#2B3A67">Tangga latihan naik transportasi umum</text><text x="60" y="108" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#4A5578">Bantuan pendamping dikurangi satu anak tangga setiap kali langkah sebelumnya sudah lancar</text><rect x="60" y="330" width="201.6" height="220" rx="16" fill="#3C4F86"/><circle cx="94" cy="366" r="20" fill="#FFD700"/><text x="94" y="374" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-size="22" font-weight="700" fill="#2B3A67">1</text><text x="76" y="418" font-family="Poppins,Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Didampingi</text><text x="76" y="446" font-family="Poppins,Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">penuh</text><text x="76" y="482" font-family="Poppins,Arial,sans-serif" font-size="17" fill="#E6EBFA">Pendamping duduk di</text><text x="76" y="506" font-family="Poppins,Arial,sans-serif" font-size="17" fill="#E6EBFA">samping</text><rect x="279.6" y="285" width="201.6" height="265" rx="16" fill="#2B3A67"/><circle cx="313.6" cy="321" r="20" fill="#FFD700"/><text x="313.6" y="329" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-size="22" font-weight="700" fill="#2B3A67">2</text><text x="295.6" y="373" font-family="Poppins,Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Pendamping</text><text x="295.6" y="401" font-family="Poppins,Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">menjaga jarak</text><text x="295.6" y="437" font-family="Poppins,Arial,sans-serif" font-size="17" fill="#E6EBFA">Duduk di bangku</text><text x="295.6" y="461" font-family="Poppins,Arial,sans-serif" font-size="17" fill="#E6EBFA">lain</tex