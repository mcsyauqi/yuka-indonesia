<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Lima langkah menyiapkan buddy system"><rect width="1200" height="470" fill="#F7F9FF"/><text x="60" y="70" font-family="Poppins,Arial,sans-serif" font-size="34" font-weight="700" fill="#2B3A67">Lima langkah menyiapkan buddy system</text><text x="60" y="108" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#4A5578">Urutan kerja guru agar program teman pendamping tidak berhenti di penunjukan nama</text><rect x="60" y="150" width="201.6" height="250" rx="16" fill="#3C4F86"/><circle cx="94" cy="186" r="20" fill="#FFD700"/><text x="94" y="194" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-size="22" font-weight="700" fill="#2B3A67">1</text><text x="76" y="238" font-family="Poppins,Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Tentukan</text><text x="76" y="266" font-family="Poppins,Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">tujuan</text><text x="76" y="302" font-family="Poppins,Arial,sans-serif" font-size="17" fill="#E6EBFA">Contoh: ikut main</text><text x="76" y="326" font-family="Poppins,Arial,sans-serif" font-size="17" fill="#E6EBFA">saat istirahat</text><rect x="279.6" y="150" width="201.6" height="250" rx="16" fill="#2B3A67"/><circle cx="313.6" cy="186" r="20" fill="#FFD700"/><text x="313.6" y="194" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-size="22" font-weight="700" fill="#2B3A67">2</text><text x="295.6" y="238" font-family="Poppins,Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Tanya anak dan</text><text x="295.6" y="266" font-family="Poppins,Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">keluarga</text><text x="295.6" y="302" font-family="Poppins,Arial,sans-serif" font-size="17" fill="#E6EBFA">Kegiatan dan teman</text><text x="295.6" y="326" font-family="Poppins,Arial,sans-serif" font-size="17" fill="#E6EBFA">yang disukai</text><rect x="499.2" y="150" width="201.6" height="250" rx="16" fill="#3C4F86"/><circle cx="533.2" cy="186" r="20" fill="#FFD700"/><text x="533.2" y="194" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-size="22" font-weight="700" fill="#2B3A67">3</text><text x="515.2" y="238" font-family="Poppins,Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Pilih dan</text><text x="515.2" y="266" font-family="Poppins,Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">latih teman</text><text x="515.2" y="302" font-family="Poppins,Arial,sans-serif" font-size="17" fill="#E6EBFA">Sukarela, dua</text><text x="515.2" y="326" font-family="Poppins,Arial,sans-serif" font-size="17" fill="#E6EBFA">sampai empat anak</text><rect x="718.8" y="150" width="201.6" height="250" rx="16" fill="#2B3A67"/><circle cx="752.8" cy="186" r="20" fill="#FFD700"/><text x="752.8" y="194" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-size="22" font-weight="700" fill="#2B3A67">4</text><text x="734.8" y="238" font-family="Poppins,Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Jalankan di</text><text x="734.8" y="266" font-family="Poppins,Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">kegiatan nyata</text><text x="734.8" y="302" font-family="Poppins,Arial,sans-serif" font-size="17" fill="#E6EBFA">Kerja kelompok,</text><text x="734.8" y="326" font-family="Poppins,Arial,sans-serif" font-size="17" fill="#E6EBFA">istirahat, ekskul</text><rect x="938.4" y="150" width="201.6" height="250" rx="16" fill="#3C4F86"/><circle cx="972.4" cy="186" r="20" fill="#FFD700"/><text x="972.4" y="194" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-size="22" font-weight="700" fill="#2B3A67">5</text><text x="954.4" y="238" font-family="Poppins,Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Pantau lalu</text><text x="954.4" y="266" font-family="Poppins,Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">kurangi</text><text x="954.4" y="294" font-family="Poppins,Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">bantuan</text><text x="954.4" y="330" font-family="Poppins,Arial,sans-serif" font-size="17" fill="#E6EBFA">Catat, evaluasi,</text><text x="954.4" y="354" font-family="Poppins,Arial,sans-serif" font-size="17" fill="#E6EBFA">gilir peran</text><text x="1140" y="446" text-anchor="end" font-family="Poppins,Arial,sans-serif" font-size="16" fill="#6B7390">Diagram: Tim YUKA, yukaindonesia.com</text></svg>