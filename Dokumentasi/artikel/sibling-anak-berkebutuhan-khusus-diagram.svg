<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Empat kebutuhan saudara kandung ABK"><rect width="1200" height="640" fill="#F7F9FF"/><text x="60" y="70" font-family="Poppins,Arial,sans-serif" font-size="34" font-weight="700" fill="#2B3A67">Empat kebutuhan saudara kandung ABK</text><text x="60" y="108" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#4A5578">Hal yang paling sering disebut dalam riset dan program dukungan sibling</text><rect x="60" y="140" width="520" height="210" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/><rect x="60" y="140" width="12" height="210" rx="6" fill="#FFD700"/><text x="96" y="192" font-family="Poppins,Arial,sans-serif" font-size="26" font-weight="700" fill="#2B3A67">Informasi yang jujur</text><text x="96" y="232" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#333">Penjelasan tentang kondisi saudaranya,</text><text x="96" y="262" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#333">disesuaikan dengan usia, dan boleh</text><text x="96" y="292" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#333">bertanya kapan saja.</text><rect x="620" y="140" width="520" height="210" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/><rect x="620" y="140" width="12" height="210" rx="6" fill="#FFD700"/><text x="656" y="192" font-family="Poppins,Arial,sans-serif" font-size="26" font-weight="700" fill="#2B3A67">Waktu khusus</text><text x="656" y="232" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#333">Waktu rutin berdua dengan ayah atau ibu,</text><text x="656" y="262" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#333">walau singkat, yang tidak harus dibayar</text><text x="656" y="292" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#333">dengan sikap selalu baik.</text><rect x="60" y="380" width="520" height="210" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/><rect x="60" y="380" width="12" height="210" rx="6" fill="#FFD700"/><text x="96" y="432" font-family="Poppins,Arial,sans-serif" font-size="26" font-weight="700" fill="#2B3A67">Ruang untuk perasaan</text><text x="96" y="472" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#333">Boleh sayang sekaligus kesal, malu, atau</text><text x="96" y="502" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#333">cemburu tanpa dicap sebagai kakak atau</text><text x="96" y="532" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#333">adik yang buruk.</text><rect x="620" y="380" width="520" height="210" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/><rect x="620" y="380" width="12" height="210" rx="6" fill="#FFD700"/><text x="656" y="432" font-family="Poppins,Arial,sans-serif" font-size="26" font-weight="700" fill="#2B3A67">Teman senasib</text><text x="656" y="472" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#333">Bertemu anak lain yang juga punya</text><text x="656" y="502" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#333">saudara berkebutuhan khusus, misalnya</text><text x="656" y="532" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#333">lewat kelompok sibling.</text><text x="1140" y="616" text-anchor="end" font-family="Poppins,Arial,sans-serif" font-size="16" fill="#6B7390">Diagram: Tim YUKA, yukaindonesia.com</text></svg>