<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Langkah mengakses PIP bagi murid homeschooling">
<rect width="1200" height="760" fill="#F7F8FC"/>
<rect width="1200" height="96" fill="#2B3A67"/>
<rect y="96" width="1200" height="6" fill="#FFD700"/>
<text x="48" y="58" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Langkah mengakses PIP bagi murid homeschooling</text>
<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="22" fill="#4A5578">Jalur yang umumnya ditempuh lewat satuan pendidikan kesetaraan</text>
<rect x="48" y="176" width="344" height="250" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/><circle cx="86" cy="216" r="24" fill="#FFD700"/><text x="86" y="225" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="24" font-weight="700" fill="#2B3A67">1</text><text x="122" y="212" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#2B3A67">Pilih PKBM atau SKB</text><text x="72" y="284" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Cari satuan pendidikan</text><text x="72" y="311" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">kesetaraan yang punya NPSN</text><text x="72" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">dan menerima murid</text><text x="72" y="365" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">sekolahrumah.</text><path d="M398 301 l24 0 m-10 -10 l10 10 l-10 10" stroke="#00BCD4" stroke-width="4" fill="none"/><rect x="428" y="176" width="344" height="250" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/><circle cx="466" cy="216" r="24" fill="#FFD700"/><text x="466" y="225" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="24" font-weight="700" fill="#2B3A67">2</text><text x="502" y="212" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#2B3A67">Daftar dan lengkapi</text><text x="502" y="240" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#2B3A67">data</text><text x="452" y="284" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Pastikan NIK, NISN, tanggal</text><text x="452" y="311" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">lahir, dan data orang tua</text><text x="452" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">sesuai dokumen kependudukan.</text><path d="M778 301 l24 0 m-10 -10 l10 10 l-10 10" stroke="#00BCD4" stroke-width="4" fill="none"/><rect x="808" y="176" width="344" height="250" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/><circle cx="846" cy="216" r="24" fill="#FFD700"/><text x="846" y="225" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="24" font-weight="700" fill="#2B3A67">3</text><text x="882" y="212" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#2B3A67">Data masuk Dapodik</text><text x="832" y="284" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Operator lembaga mencatat</text><text x="832" y="311" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">murid di Dapodik secara</text><text x="832" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">lengkap, valid, dan logis.</text><rect x="48" y="466" width="344" height="250" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/><circle cx="86" cy="506" r="24" fill="#FFD700"/><text x="86" y="515" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="24" font-weight="700" fill="#2B3A67">4</text><text x="122" y="502" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#2B3A67">Cek data</text><text x="122" y="530" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#2B3A67">kesejahteraan</text><text x="72" y="574" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Keluarga terdata di data</text><text x="72" y="601" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">kesejahteraan sosial melalui</text><text x="72" y="628" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">desa atau dinas sosial.</text><path d="M398 591 l24 0 m-10 -10 l10 10 l-10 10" stroke="#00BCD4" stroke-width="4" fill="none"/><rect x="428" y="466" width="344" height="250" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/><circle cx="466" cy="506" r="24" fill="#FFD700"/><text x="466" y="515" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="24" font-weight="700" fill="#2B3A67">5</text><text x="502" y="502" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#2B3A67">Ditandai layak PIP</text><text x="452" y="574" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Satuan pendidikan menandai</text><text x="452" y="601" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">layak PIP dan dinas atau</text><text x="452" y="628" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">pemangku kepentingan</text><text x="452" y="655" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">mengusulkan.</text><path d="M778 591 l24 0 m-10 -10 l10 10 l-10 10" stroke="#00BCD4" stroke-width="4" fill="none"/><rect x="808" y="466" width="344" height="250" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/><circle cx="846" cy="506" r="24" fill="#FFD700"/><text x="846" y="515" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="24" font-weight="700" fill="#2B3A67">6</text><text x="882" y="502" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#2B3A67">Pantau penetapan</text><text x="832" y="574" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Cek status di laman PIP resmi</text><text x="832" y="601" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">dan aktivasi rekening bila</text><text x="832" y="628" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">ditetapkan sebagai penerima.</text>
<text x="1152" y="738" text-anchor="end" font-family="Poppins, Arial, sans-serif" font-size="18" fill="#7A84A3">Diagram: Tim YUKA (yukaindonesia.com)</text>
</svg>
