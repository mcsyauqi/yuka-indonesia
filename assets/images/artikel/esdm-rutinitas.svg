<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Satu putaran rutinitas bermain bersama">
<rect width="1200" height="760" fill="#F7F8FC"/>
<rect width="1200" height="96" fill="#2B3A67"/>
<rect y="96" width="1200" height="6" fill="#FFD700"/>
<text x="48" y="58" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Satu putaran rutinitas bermain bersama</text>
<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="22" fill="#4A5578">Pola kegiatan bersama (joint activity routine) dalam ESDM</text>
<rect x="48" y="176" width="344" height="250" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/><circle cx="86" cy="216" r="24" fill="#FFD700"/><text x="86" y="225" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="24" font-weight="700" fill="#2B3A67">1</text><text x="122" y="212" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#2B3A67">Ikuti minat anak</text><text x="72" y="284" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Orang dewasa memperhatikan</text><text x="72" y="311" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">mainan atau kegiatan yang</text><text x="72" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">dipilih anak.</text><path d="M398 301 l24 0 m-10 -10 l10 10 l-10 10" stroke="#00BCD4" stroke-width="4" fill="none"/><rect x="428" y="176" width="344" height="250" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/><circle cx="466" cy="216" r="24" fill="#FFD700"/><text x="466" y="225" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="24" font-weight="700" fill="#2B3A67">2</text><text x="502" y="212" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#2B3A67">Bangun permainan</text><text x="452" y="284" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Orang dewasa ikut bermain dan</text><text x="452" y="311" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">menjadi bagian dari kegiatan</text><text x="452" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">itu.</text><path d="M778 301 l24 0 m-10 -10 l10 10 l-10 10" stroke="#00BCD4" stroke-width="4" fill="none"/><rect x="808" y="176" width="344" height="250" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/><circle cx="846" cy="216" r="24" fill="#FFD700"/><text x="846" y="225" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="24" font-weight="700" fill="#2B3A67">3</text><text x="882" y="212" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#2B3A67">Sisipkan tujuan</text><text x="832" y="284" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Ada kesempatan meniru,</text><text x="832" y="311" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">menunjuk, bersuara, atau</text><text x="832" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">bergantian.</text><rect x="48" y="466" width="344" height="250" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/><circle cx="86" cy="506" r="24" fill="#FFD700"/><text x="86" y="515" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="24" font-weight="700" fill="#2B3A67">4</text><text x="122" y="502" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#2B3A67">Variasikan</text><text x="72" y="574" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Permainan dikembangkan agar</text><text x="72" y="601" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">anak belajar hal baru.</text><path d="M398 591 l24 0 m-10 -10 l10 10 l-10 10" stroke="#00BCD4" stroke-width="4" fill="none"/><rect x="428" y="466" width="344" height="250" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/><circle cx="466" cy="506" r="24" fill="#FFD700"/><text x="466" y="515" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="24" font-weight="700" fill="#2B3A67">5</text><text x="502" y="502" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#2B3A67">Tutup dan pindah</text><text x="452" y="574" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Permainan diakhiri, lalu anak</text><text x="452" y="601" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">memilih kegiatan berikutnya.</text>
<text x="1152" y="738" text-anchor="end" font-family="Poppins, Arial, sans-serif" font-size="18" fill="#7A84A3">Diagram: Tim YUKA (yukaindonesia.com)</text>
</svg>
