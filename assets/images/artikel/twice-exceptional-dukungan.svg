3333333333333" y="360" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Strategi kompensasi dan</text><text x="467.3333333333333" y="386" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">alat bantu</text><circle cx="451.3333333333333" cy="421" r="6" fill="#00838F"/><text x="467.3333333333333" y="428" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Terapi sesuai kondisi</text><text x="467.3333333333333" y="454" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">penyerta</text><rect x="802.6666666666666" y="176" width="349.3333333333333" height="334" rx="18" fill="#FFFFFF" stroke="#B8860B" stroke-width="3"/><rect x="802.6666666666666" y="176" width="349.3333333333333" height="78" rx="18" fill="#B8860B"/><rect x="802.6666666666666" y="226" width="349.3333333333333" height="28" fill="#B8860B"/><text x="824.6666666666666" y="210" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Menguatkan diri</text><circle cx="828.6666666666666" cy="285" r="6" fill="#B8860B"/><text x="844.6666666666666" y="292" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Mengenal profil diri</text><circle cx="828.6666666666666" cy="327" r="6" fill="#B8860B"/><text x="844.6666666666666" y="334" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Belajar menyuarakan</text><text x="844.6666666666666" y="360" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">kebutuhan</text><circle cx="828.6666666666666" cy="395" r="6" fill="#B8860B"/><text x="844.6666666666666" y="402" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Dukungan emosional</text>
