<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="22" fill="#4A5578">Inklusi gagal ketika hanya satu pihak yang bekerja</text>
<rect x="48" y="176" width="349.3333333333333" height="334" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="3"/><rect x="48" y="176" width="349.3333333333333" height="78" rx="18" fill="#2B3A67"/><rect x="48" y="226" width="349.3333333333333" height="28" fill="#2B3A67"/><text x="70" y="210" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Orang tua</text><circle cx="74" cy="285" r="6" fill="#2B3A67"/><text x="90" y="292" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Menyampaikan kebutuhan anak</text><text x="90" y="318" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">secara spesifik</text><circle cx="74" cy="353" r="6" fill="#2B3A67"/><text x="90" y="360" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Meminta rencana dan jadwal</text><text x="90" y="386" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">tinjauan</text><circle cx="74" cy="421" r="6" fill="#2B3A67"/><text x="90" y="428" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Menjaga komunikasi dua arah</text><text x="90" y="454" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">dengan guru</text><rect x="425.3333333333333" y="176" width="349.3333333333333" height="334" rx="18" fill="#FFFFFF" stroke="#00838F" stroke-width="3"/><rect x="425.3333333333333" y="176" width="349.3333333333333" height="78" rx="18" fill="#00838F"/><rect x="425.3333333333333" y="226" width="349.3333333333333" height="28" fill="#00838F"/><text x="447.3333333333333" y="210" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Sekolah dan guru</text><circle cx="451.3333333333333" cy="285" r="6" fill="#00838F"/><text x="467.3333333333333" y="292" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Menyesuaikan cara mengajar</text><text x="467.3333333333333" y="318" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">dan menilai</text><circle cx="451.3333333333333" cy="353" r="6" fill="#00838F"/><text x="467.3333333333333" y="360" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Mencatat kemajuan dan</text><text x="467.3333333333333" y="386" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">menindaklanjuti</text><circle cx="451.3333333333333" cy="421" r="6" fill="#00838F"/><text x="467.3333333333333" y="428" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Menegakkan aturan</text><text x="467.3333333333333" y="454" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">antiperundungan</text><rect x="802.6666666666666" y="176" width="349.3333333333333" height="334" rx="18" fill="#FFFFFF" stroke="#7A5A06" stroke-width="3"/><rect x="802.6666666666666" y="176" width="349.3333333333333" height="78" rx="18" fill="#7A5A06"/><rect x="802.6666666666666" y="226" width="349.3333333333333" height="28" fill="#7A5A06"/><text x="824.6666666666666" y="210" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Masyarakat</text><circle cx="828.6666666666666" cy="285" r="6" fill="#7A5A06"/><text x="844.6666666666666" y="292" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Menyediakan akses layanan</text><text x="844.6666666666666" y="318" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">dan transportasi</text><circle cx="828.6666666666666" cy="353" r="6" fill="#7A5A06"/><text x="844.6666666666666" y="360" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Membuka kegiatan untuk</text><text x="844.6666666666666" y="386" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">semua anak</text><circle cx="828.6666666666666" cy="421" r="6" fill="#7A5A06"/><text x="844.6666666666666" y="428" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Menghentikan ujaran 