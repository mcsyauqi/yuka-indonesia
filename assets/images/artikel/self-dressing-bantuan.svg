<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Bantuan bertahap saat berpakaian">
<rect width="1200" height="760" fill="#F7F8FC"/>
<rect width="1200" height="96" fill="#2B3A67"/>
<rect y="96" width="1200" height="6" fill="#FFD700"/>
<text x="48" y="58" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Bantuan bertahap saat berpakaian</text>
<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="22" fill="#4A5578">Catat bantuan yang dipakai agar target berikutnya jelas</text>
<rect x="48" y="172" width="1104" height="56" fill="#2B3A67"/><text x="64" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Tahap</text><text x="294" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Peran orang dewasa</text><text x="774" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Tanda bantuan dapat dikurangi</text><rect x="48" y="228" width="1104" height="78" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Mulai</text><text x="294" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Menyiapkan posisi dan menunjukkan langkah</text><text x="294" y="286" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">pertama.</text><text x="774" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Anak mengikuti arah dengan respons</text><text x="774" y="286" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">yang konsisten.</text><rect x="48" y="306" width="1104" height="78" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Dengan isyarat</text><text x="294" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Memberi contoh, gestur, atau petunjuk</text><text x="294" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">singkat.</text><text x="774" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Anak memulai gerak setelah</text><text x="774" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">isyarat.</text><rect x="48" y="384" width="1104" height="78" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Sentuhan ringan</text><text x="294" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Menstabilkan bagian tubuh tanpa</text><text x="294" y="442" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">mengerjakan seluruh tugas.</text><text x="774" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Anak menyelesaikan sebagian besar</text><text x="774" y="442" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">gerak.</text><rect x="48" y="462" width="1104" height="78" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Mandiri</text><text x="294" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Mengawasi keselamatan dan memberi waktu.</text><text x="774" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Anak meminta bantuan pada bagian</text><text x="774" y="520" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">yang memang sulit.</text>
<text x="1152" y="738" text-anchor="end" font-family="Poppins, Arial, sans-serif" font-size="18" fill="#7A84A3">Diagram: Tim YUKA (yukaindonesia.com)</text>
</svg>
