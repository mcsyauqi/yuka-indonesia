<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Hambatan yang sering muncul dan langkah pertama">
<rect width="1200" height="760" fill="#F7F8FC"/>
<rect width="1200" height="96" fill="#2B3A67"/>
<rect y="96" width="1200" height="6" fill="#FFD700"/>
<text x="48" y="58" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Hambatan yang sering muncul dan langkah pertama</text>
<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="22" fill="#4A5578">Hambatan disusun UNESCO sebagai tantangan menuju pendidikan inklusif</text>
<rect x="48" y="172" width="1104" height="56" fill="#2B3A67"/><text x="64" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Hambatan</text><text x="344" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Wujudnya di sekolah</text><text x="784" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Langkah pertama</text><rect x="48" y="228" width="1104" height="78" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Pemahaman berbeda</text><text x="344" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Inklusi dibaca sekadar menerima</text><text x="344" y="286" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">pendaftaran</text><text x="784" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Sepakati definisi dan ukuran</text><text x="784" y="286" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">keberhasilan bersama.</text><rect x="48" y="306" width="1104" height="78" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Guru kurang didukung</text><text x="344" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Tidak ada pelatihan dan tidak ada</text><text x="344" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">pendamping</text><text x="784" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Prioritaskan pelatihan guru dan</text><text x="784" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">penempatan GPK.</text><rect x="48" y="384" width="1104" height="78" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Data tidak ada</text><text x="344" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Kebutuhan siswa tidak tercatat</text><text x="784" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Mulai dari asesmen sederhana dan</text><text x="784" y="442" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">catatan kemajuan.</text><rect x="48" y="462" width="1104" height="78" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Sarana belum memadai</text><text x="344" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Akses fisik dan bahan ajar terbatas</text><text x="784" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Perbaiki yang paling menghambat</text><text x="784" y="520" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">lebih dulu, bertahap.</text>
<text x="1152" y="738" text-anchor="end" font-family="Poppins, Arial, sans-serif" font-size="18" fill="#7A84A3">Diagram: Tim YUKA (yukaindonesia.com)</text>
</svg>
