<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Rencana mengurangi pendampingan bertahap">
<rect width="1200" height="760" fill="#F7F8FC"/>
<rect width="1200" height="96" fill="#2B3A67"/>
<rect y="96" width="1200" height="6" fill="#FFD700"/>
<text x="48" y="58" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Rencana mengurangi pendampingan bertahap</text>
<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="22" fill="#4A5578">Pendampingan yang dirancang menuju kemandirian juga menekan biaya jangka panjang</text>
<rect x="48" y="172" width="1104" height="56" fill="#2B3A67"/><text x="64" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Fase</text><text x="314" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Peran pendamping</text><text x="764" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Tanda siap ke fase berikutnya</text><rect x="48" y="228" width="1104" height="78" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Fase 1: adaptasi</text><text x="314" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Mendampingi hampir seluruh kegiatan dan</text><text x="314" y="286" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">memetakan pemicu</text><text x="764" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Anak mengenal rutinitas dan mau</text><text x="764" y="286" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">meminta bantuan</text><rect x="48" y="306" width="1104" height="78" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Fase 2: bantuan</text><text x="64" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">terarah</text><text x="314" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Hadir pada pelajaran atau waktu yang</text><text x="314" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">paling menantang</text><text x="764" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Anak bertahan lebih lama dalam</text><text x="764" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">tugas kelas</text><rect x="48" y="384" width="1104" height="78" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Fase 3: dari jauh</text><text x="314" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Mengamati dari belakang kelas, membantu</text><text x="314" y="442" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">guru bila perlu</text><text x="764" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Guru dan teman sebaya mulai</text><text x="764" y="442" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">mengambil peran</text><rect x="48" y="462" width="1104" height="78" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Fase 4: konsultasi</text><text x="314" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Kunjungan berkala untuk evaluasi dan</text><text x="314" y="520" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">pelatihan guru</text><text x="764" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Anak mandiri dengan dukungan kelas</text><text x="764" y="520" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">biasa</text>
<text x="1152" y="738" text-anchor="end" font-family="Poppins, Arial, sans-serif" font-size="18" fill="#7A84A3">Diagram: Tim YUKA (yukaindonesia.com)</text>
</svg>
