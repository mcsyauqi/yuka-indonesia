="386" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">sebelumnya</text><circle cx="357" cy="421" r="6" fill="#2B3A67"/><text x="373" y="428" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Porsi disiapkan</text><text x="373" y="454" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">orang dewasa</text><rect x="614" y="176" width="255" height="334" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="3"/><rect x="614" y="176" width="255" height="78" rx="18" fill="#2B3A67"/><rect x="614" y="226" width="255" height="28" fill="#2B3A67"/><text x="636" y="210" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Semua sepakat</text><circle cx="640" cy="285" r="6" fill="#2B3A67"/><text x="656" y="292" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Keluarga besar paham</text><text x="656" y="318" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">aturan</text><circle cx="640" cy="353" r="6" fill="#2B3A67"/><text x="656" y="360" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Sekolah dan tetangga</text><text x="656" y="386" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">dilibatkan</text><circle cx="640" cy="421" r="6" fill="#2B3A67"/><text x="656" y="428" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Hadiah tidak berupa</text><text x="656" y="454" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">makanan</text><rect x="897" y="176" width="255" height="334" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="3"/><rect x="897" y="176" width="255" height="78" rx="18" fill="#2B3A67"/><rect x="897" y="226" width="255" height="28" fill="#2B3A67"/><text x="919" y="210" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Tetap bergerak</text><circle cx="923" cy="285" r="6" fill="#2B3A67"/><text x="939" y="292" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Aktivitas fisik</text><text x="939" y="318" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">setiap hari</text><circle cx="923" cy="353" r="6" fill="#2B3A67"/><text x="939" y="360" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Fisioterapi bila</text><text x="939" y="386" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">dianjurkan</text><circle cx="923" cy="421" r="6" fill="#2B3A67"/><text x="939" y="428" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Jalan kaki bersama</text><text x="939" y="454" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">keluarga</text>
