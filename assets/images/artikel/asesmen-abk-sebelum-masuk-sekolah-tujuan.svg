<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Asesmen pra-sekolah: untuk apa?">
<rect width="1200" height="760" fill="#F7F8FC"/>
<rect width="1200" height="96" fill="#2B3A67"/>
<rect y="96" width="1200" height="6" fill="#FFD700"/>
<text x="48" y="58" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Asesmen pra-sekolah: untuk apa?</text>
<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="22" fill="#4A5578">Membedakan tujuan asesmen dari seleksi masuk</text>
<rect x="48" y="176" width="349.3333333333333" height="428" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="3"/><rect x="48" y="176" width="349.3333333333333" height="78" rx="18" fill="#2B3A67"/><rect x="48" y="226" width="349.3333333333333" height="28" fill="#2B3A67"/><text x="70" y="210" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Tujuan yang sah</text><circle cx="74" cy="285" r="6" fill="#2B3A67"/><text x="90" y="292" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Memahami kekuatan dan</text><text x="90" y="318" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">hambatan belajar anak</text><circle cx="74" cy="353" r="6" fill="#2B3A67"/><text x="90" y="360" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Menentukan akomodasi yang</text><text x="90" y="386" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">layak sejak hari pertama</text><circle cx="74" cy="421" r="6" fill="#2B3A67"/><text x="90" y="428" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Menyiapkan guru dan</text><text x="90" y="454" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">lingkungan kelas</text><circle cx="74" cy="489" r="6" fill="#2B3A67"/><text x="90" y="496" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Menjadi dasar program</text><text x="90" y="522" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">pembelajaran individual</text><rect x="425.3333333333333" y="176" width="349.3333333333333" height="428" rx="18" fill="#FFFFFF" stroke="#E53935" stroke-width="3"/><rect x="425.3333333333333" y="176" width="349.3333333333333" height="78" rx="18" fill="#E53935"/><rect x="425.3333333333333" y="226" width="349.3333333333333" height="28" fill="#E53935"/><text x="447.3333333333333" y="210" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Bukan tujuannya</text><circle cx="451.3333333333333" cy="285" r="6" fill="#E53935"/><text x="467.3333333333333" y="292" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Tes membaca, menulis,</text><text x="467.3333333333333" y="318" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">berhitung sebagai syarat</text><text x="467.3333333333333" y="344" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">kelas 1 SD</text><circle cx="451.3333333333333" cy="379" r="6" fill="#E53935"/><text x="467.3333333333333" y="386" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Mencari alasan untuk</text><text x="467.3333333333333" y="412" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">menolak calon murid</text><circle cx="451.3333333333333" cy="447" r="6" fill="#E53935"/><text x="467.3333333333333" y="454" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Memberi label permanen pada</text><text x="467.3333333333333" y="480" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">anak</text><circle cx="451.3333333333333" cy="515" r="6" fill="#E53935"/><text x="467.3333333333333" y="522" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Menggantikan diagnosis oleh</text><text x="467.3333333333333" y="548" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">tenaga kesehatan</text><rect x="802.6666666666666" y="176" width="349.3333333333333" height="428" rx="18" fill="#FFFFFF" stroke="#00838F" stroke-width="3"/><rect x="802.6666666666666" y="176" width="349.3333333333333" height="78" rx="18" fill="#00838F"/><rect x="802.6666666666666" y="226" width="349.3333333333333" height="28" fill="#00838F"/><text x="824.6666666666666" y="210" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Hasil yang berguna</text><circle cx="828.6666666666666" cy="285" r="6" fill="#00838F"/><text x="844.6666666666666" y="292" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Profil kemampuan dalam</text><text x="844.6666666666666" y="318" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">bahasa sehari-hari</text><circle cx="828.6666666666666" cy="353" r="6" fill="#00838F"/><text x="844.6666666666666" y="360" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Daftar penyesuaian yang</text><text x="844.6666666666666" y="386" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">konkret</text><circle cx="828.6666666666666" cy="421" r="6" fill="#00838F"/><text x="844.6666666666666" y="428" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Nama penanggung jawab di</text><text x="844.6666666666666" y="454" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">sekolah</text><circle cx="828.6666666666666" cy="489" r="6" fill="#00838F"/><text x="844.6666666666666" y="496" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Jadwal evaluasi bersama</text><text x="844.6666666666666" y="522" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">keluarga</text>
<text x="1152" y="738" text-anchor="end" font-family="Poppins, Arial, sans-serif" font-size="18" fill="#7A84A3">Diagram: Tim YUKA (yukaindonesia.com)</text>
</svg>
