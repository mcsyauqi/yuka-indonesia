<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Empat bentuk keterlibatan ayah">
<rect width="1200" height="760" fill="#F7F8FC"/>
<rect width="1200" height="96" fill="#2B3A67"/>
<rect y="96" width="1200" height="6" fill="#FFD700"/>
<text x="48" y="58" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Empat bentuk keterlibatan ayah</text>
<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="22" fill="#4A5578">Keterlibatan tidak harus besar, yang penting rutin</text>
<rect x="48" y="176" width="255" height="334" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="3"/><rect x="48" y="176" width="255" height="78" rx="18" fill="#2B3A67"/><rect x="48" y="226" width="255" height="28" fill="#2B3A67"/><text x="70" y="210" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Harian</text><circle cx="74" cy="285" r="6" fill="#2B3A67"/><text x="90" y="292" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Memegang satu</text><text x="90" y="318" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">rutinitas tetap</text><circle cx="74" cy="353" r="6" fill="#2B3A67"/><text x="90" y="360" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Mandi, makan, atau</text><text x="90" y="386" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">menidurkan</text><circle cx="74" cy="421" r="6" fill="#2B3A67"/><text x="90" y="428" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Mengantar ke sekolah</text><rect x="331" y="176" width="255" height="334" rx="18" fill="#FFFFFF" stroke="#00BCD4" stroke-width="3"/><rect x="331" y="176" width="255" height="78" rx="18" fill="#00BCD4"/><rect x="331" y="226" width="255" height="28" fill="#00BCD4"/><text x="353" y="210" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Bermain</text><circle cx="357" cy="285" r="6" fill="#00BCD4"/><text x="373" y="292" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Bermain sesuai minat</text><text x="373" y="318" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">anak</text><circle cx="357" cy="353" r="6" fill="#00BCD4"/><text x="373" y="360" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Kegiatan fisik di</text><text x="373" y="386" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">luar rumah</text><circle cx="357" cy="421" r="6" fill="#00BCD4"/><text x="373" y="428" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Membaca atau merakit</text><text x="373" y="454" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">balok</text><rect x="614" y="176" width="255" height="334" rx="18" fill="#FFFFFF" stroke="#E53935" stroke-width="3"/><rect x="614" y="176" width="255" height="78" rx="18" fill="#E53935"/><rect x="614" y="226" width="255" height="28" fill="#E53935"/><text x="636" y="210" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Keputusan</text><circle cx="640" cy="285" r="6" fill="#E53935"/><text x="656" y="292" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Ikut asesmen dan</text><text x="656" y="318" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">rapat sekolah</text><circle cx="640" cy="353" r="6" fill="#E53935"/><text x="656" y="360" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Memahami program</text><text x="656" y="386" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">terapi</text><circle cx="640" cy="421" r="6" fill="#E53935"/><text x="656" y="428" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Ikut merencanakan</text><text x="656" y="454" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">keuangan</text><rect x="897" y="176" width="255" height="334" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="3"/><rect x="897" y="176" width="255" height="78" rx="18" fill="#2B3A67"/><rect x="897" y="226" width="255" height="28" fill="#2B3A67"/><text x="919" y="210" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Dukungan</text><circle cx="923" cy="285" r="6" fill="#2B3A67"/><text x="939" y="292" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Menjadi tempat</text><text x="939" y="318" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">cerita pasangan</text><circle cx="923" cy="353" r="6" fill="#2B3A67"/><text x="939" y="360" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Berbagi tugas secara</text><text x="939" y="386" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">adil</text><circle cx="923" cy="421" r="6" fill="#2B3A67"/><text x="939" y="428" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Menjaga kesehatan</text><text x="939" y="454" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">emosi sendiri</text>
<text x="1152" y="738" text-anchor="end" font-family="Poppins, Arial, sans-serif" font-size="18" fill="#7A84A3">Diagram: Tim YUKA (yukaindonesia.com)</text>
