<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Siapa yang bisa mendukung guru">
<rect width="1200" height="760" fill="#F7F8FC"/>
<rect width="1200" height="96" fill="#2B3A67"/>
<rect y="96" width="1200" height="6" fill="#FFD700"/>
<text x="48" y="58" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Siapa yang bisa mendukung guru</text>
<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="22" fill="#4A5578">Sumber dukungan menurut Permendikbudristek 48/2023</text>
<rect x="48" y="172" width="1104" height="56" fill="#2B3A67"/><text x="64" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Pihak</text><text x="364" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Peran untuk guru</text><text x="834" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Dasar</text><rect x="48" y="228" width="1104" height="52" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Guru pendidikan khusus</text><text x="364" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Membimbing atau mendampingi guru lain</text><text x="834" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Pasal 10 ayat (2)</text><rect x="48" y="280" width="1104" height="78" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="312" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Unit Layanan Disabilitas</text><text x="364" y="312" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Pelatihan, bimbingan teknis,</text><text x="364" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">pendampingan</text><text x="834" y="312" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Pasal 16 ayat (1) dan (5)</text><rect x="48" y="358" width="1104" height="52" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="390" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Psikolog dan terapis</text><text x="364" y="390" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Masukan asesmen dan strategi</text><text x="834" y="390" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Pasal 18 ayat (1)</text><rect x="48" y="410" width="1104" height="78" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="442" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Praktisi khusus</text><text x="364" y="442" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Bahasa isyarat, braille, teknologi</text><text x="364" y="468" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">asistif</text><text x="834" y="442" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Pasal 18 ayat (1) huruf f</text><rect x="48" y="488" width="1104" height="52" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="520" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Guru pendamping magang</text><text x="364" y="520" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Mendampingi praktik magang</text><text x="834" y="520" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Pasal 9 ayat (7) dan (8)</text>
<text x="1152" y="738" text-anchor="end" font-family="Poppins, Arial, sans-serif" font-size="18" fill="#7A84A3">Diagram: Tim YUKA (yukaindonesia.com)</text>
