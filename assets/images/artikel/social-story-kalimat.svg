<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Jenis kalimat dalam social story">
<rect width="1200" height="760" fill="#F7F8FC"/>
<rect width="1200" height="96" fill="#2B3A67"/>
<rect y="96" width="1200" height="6" fill="#FFD700"/>
<text x="48" y="58" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Jenis kalimat dalam social story</text>
<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="22" fill="#4A5578">Disarikan dari format Social Stories yang dikembangkan Carol Gray</text>
<rect x="48" y="172" width="1104" height="56" fill="#2B3A67"/><text x="64" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Jenis kalimat</text><text x="324" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Fungsinya</text><text x="744" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Contoh</text><rect x="48" y="228" width="1104" height="78" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Deskriptif</text><text x="324" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Fakta yang bisa diamati tentang</text><text x="324" y="286" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">situasi</text><text x="744" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Setiap pagi, kelas dimulai pukul</text><text x="744" y="286" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">tujuh.</text><rect x="48" y="306" width="1104" height="78" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Perspektif</text><text x="324" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Pikiran atau perasaan orang lain</text><text x="744" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Bu guru senang kalau kami datang</text><text x="744" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">tepat waktu.</text><rect x="48" y="384" width="1104" height="78" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Direktif</text><text x="324" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Pilihan tindakan, ditulis positif</text><text x="744" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Aku bisa menunggu giliran sambil</text><text x="744" y="442" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">duduk.</text><rect x="48" y="462" width="1104" height="52" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Afirmatif</text><text x="324" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Menegaskan nilai atau aturan bersama</text><text x="744" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Ini cara yang baik dan aman.</text><rect x="48" y="514" width="1104" height="78" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="546" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Kooperatif</text><text x="324" y="546" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Bantuan yang diberikan orang lain</text><text x="744" y="546" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Bu guru akan membantu kalau aku</text><text x="744" y="572" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">bingung.</text>
<text x="1152" y="738" text-anchor="end" font-family="Poppins, Arial, sans-serif" font-size="18" fill="#7A84A3">Diagram: Tim YUKA (yukaindonesia.com)</text>
</svg>
