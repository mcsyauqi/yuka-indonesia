<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Tiga model pendampingan dan konsekuensi biayanya">
<rect width="1200" height="760" fill="#F7F8FC"/>
<rect width="1200" height="96" fill="#2B3A67"/>
<rect y="96" width="1200" height="6" fill="#FFD700"/>
<text x="48" y="58" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Tiga model pendampingan dan konsekuensi biayanya</text>
<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="22" fill="#4A5578">Model kerja menentukan siapa membayar dan apa saja yang termasuk</text>
<rect x="48" y="176" width="349.3333333333333" height="386" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="3"/><rect x="48" y="176" width="349.3333333333333" height="78" rx="18" fill="#2B3A67"/><rect x="48" y="226" width="349.3333333333333" height="28" fill="#2B3A67"/><text x="70" y="210" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Melalui lembaga</text><circle cx="74" cy="285" r="6" fill="#2B3A67"/><text x="90" y="292" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Ada supervisor dan</text><text x="90" y="318" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">pengganti saat pendamping</text><text x="90" y="344" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">sakit</text><circle cx="74" cy="379" r="6" fill="#2B3A67"/><text x="90" y="386" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Tarif biasanya memuat biaya</text><text x="90" y="412" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">pelatihan dan administrasi</text><circle cx="74" cy="447" r="6" fill="#2B3A67"/><text x="90" y="454" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Minta rincian komponen</text><text x="90" y="480" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">dalam penawaran tertulis</text><rect x="425.3333333333333" y="176" width="349.3333333333333" height="386" rx="18" fill="#FFFFFF" stroke="#00838F" stroke-width="3"/><rect x="425.3333333333333" y="176" width="349.3333333333333" height="78" rx="18" fill="#00838F"/><rect x="425.3333333333333" y="226" width="349.3333333333333" height="28" fill="#00838F"/><text x="447.3333333333333" y="210" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Direkrut keluarga</text><circle cx="451.3333333333333" cy="285" r="6" fill="#00838F"/><text x="467.3333333333333" y="292" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Tarif dasar bisa lebih</text><text x="467.3333333333333" y="318" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">fleksibel</text><circle cx="451.3333333333333" cy="353" r="6" fill="#00838F"/><text x="467.3333333333333" y="360" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Keluarga menanggung urusan</text><text x="467.3333333333333" y="386" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">kontrak, cuti, dan</text><text x="467.3333333333333" y="412" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">pengganti</text><circle cx="451.3333333333333" cy="447" r="6" fill="#00838F"/><text x="467.3333333333333" y="454" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Perlu izin dan kesepakatan</text><text x="467.3333333333333" y="480" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">dengan sekolah</text><rect x="802.6666666666666" y="176" width="349.3333333333333" height="386" rx="18" fill="#FFFFFF" stroke="#7A5A06" stroke-width="3"/><rect x="802.6666666666666" y="176" width="349.3333333333333" height="78" rx="18" fill="#7A5A06"/><rect x="802.6666666666666" y="226" width="349.3333333333333" height="28" fill="#7A5A06"/><text x="824.6666666666666" y="210" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Disediakan sekolah atau</text><text x="824.6666666666666" y="238" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">ULD</text><circle cx="828.6666666666666" cy="285" r="6" fill="#7A5A06"/><text x="844.6666666666666" y="292" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Bagian dari akomodasi yang</text><text x="844.6666666666666" y="318" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">layak sesuai kemampuan</text><text x="844.6666666666666" y="344" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">sekolah</text><circle cx="828.6666666666666" cy="379" r="6" fill="#7A5A06"/><text x="844.6666666666666" y="386" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Tanyakan apakah ada guru</text><text x="844.6666666666666" y="412" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">pembimbing khusus</text><circle cx="828.6666666666666" cy="447" r="6" fill="#7A5A06"/><text x="844.6666666666666" y="454" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Ketersediaan berbeda</text><text x="844.6666666666666" y="480" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">antardaerah dan</text><text x="844.6666666666666" y="506" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">antarsekolah</text>
<text x="1152" y="738" text-anchor="end" font-family="Poppins, Arial, sans-serif" font-size="18" fill="#7A84A3">Diagram: Tim YUKA (yukaindonesia.com)</text>
</svg>
