<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Tiga ukuran inklusi yang sebenarnya">
<rect width="1200" height="760" fill="#F7F8FC"/>
<rect width="1200" height="96" fill="#2B3A67"/>
<rect y="96" width="1200" height="6" fill="#FFD700"/>
<text x="48" y="58" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Tiga ukuran inklusi yang sebenarnya</text>
<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="22" fill="#4A5578">Kehadiran fisik saja belum memenuhi satu pun dari ketiganya</text>
<rect x="48" y="176" width="349.3333333333333" height="334" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="3"/><rect x="48" y="176" width="349.3333333333333" height="78" rx="18" fill="#2B3A67"/><rect x="48" y="226" width="349.3333333333333" height="28" fill="#2B3A67"/><text x="70" y="210" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Akses</text><circle cx="74" cy="285" r="6" fill="#2B3A67"/><text x="90" y="292" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Anak diterima dan terdaftar</text><circle cx="74" cy="327" r="6" fill="#2B3A67"/><text x="90" y="334" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Lingkungan fisik dapat</text><text x="90" y="360" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">dijangkau</text><circle cx="74" cy="395" r="6" fill="#2B3A67"/><text x="90" y="402" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Biaya dan jarak tidak</text><text x="90" y="428" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">menghalangi</text><rect x="425.3333333333333" y="176" width="349.3333333333333" height="334" rx="18" fill="#FFFFFF" stroke="#00838F" stroke-width="3"/><rect x="425.3333333333333" y="176" width="349.3333333333333" height="78" rx="18" fill="#00838F"/><rect x="425.3333333333333" y="226" width="349.3333333333333" height="28" fill="#00838F"/><text x="447.3333333333333" y="210" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Partisipasi</text><circle cx="451.3333333333333" cy="285" r="6" fill="#00838F"/><text x="467.3333333333333" y="292" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Anak ikut kegiatan belajar</text><circle cx="451.3333333333333" cy="327" r="6" fill="#00838F"/><text x="467.3333333333333" y="334" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Materi disajikan dengan</text><text x="467.3333333333333" y="360" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">cara yang dapat diakses</text><circle cx="451.3333333333333" cy="395" r="6" fill="#00838F"/><text x="467.3333333333333" y="402" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Anak punya teman dan peran</text><text x="467.3333333333333" y="428" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">di kelas</text><rect x="802.6666666666666" y="176" width="349.3333333333333" height="334" rx="18" fill="#FFFFFF" stroke="#7A5A06" stroke-width="3"/><rect x="802.6666666666666" y="176" width="349.3333333333333" height="78" rx="18" fill="#7A5A06"/><rect x="802.6666666666666" y="226" width="349.3333333333333" height="28" fill="#7A5A06"/><text x="824.6666666666666" y="210" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Hasil belajar</text><circle cx="828.6666666666666" cy="285" r="6" fill="#7A5A06"/><text x="844.6666666666666" y="292" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Kemajuan dicatat dan</text><text x="844.6666666666666" y="318" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">ditinjau</text><circle cx="828.6666666666666" cy="353" r="6" fill="#7A5A06"/><text x="844.6666666666666" y="360" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Penilaian disesuaikan tanpa</text><text x="844.6666666666666" y="386" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">menurunkan tujuan</text><circle cx="828.6666666666666" cy="421" r="6" fill="#7A5A06"/><text x="844.6666666666666" y="428" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Ada rencana untuk tahap</text><text x="844.6666666666666" y="454" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">berikutnya</text>
<text x="1152" y="738" text-anchor="end" font-family="Poppins, Arial, sans-serif" font-size="18" fill="#7A84A3">Diagram: Tim YUKA (yukaindonesia.com)</text>
</svg>
