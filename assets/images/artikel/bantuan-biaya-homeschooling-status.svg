<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Status homeschooling dan peluang bantuan">
<rect width="1200" height="760" fill="#F7F8FC"/>
<rect width="1200" height="96" fill="#2B3A67"/>
<rect y="96" width="1200" height="6" fill="#FFD700"/>
<text x="48" y="58" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Status homeschooling dan peluang bantuan</text>
<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="22" fill="#4A5578">Gambaran umum; pastikan ke dinas pendidikan dan lembaga setempat</text>
<rect x="48" y="172" width="1104" height="56" fill="#2B3A67"/><text x="64" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Status anak</text><text x="394" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Dasar aturan</text><text x="774" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Peluang bantuan pemerintah</text><rect x="48" y="228" width="1104" height="78" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Murid Paket A, B, C di PKBM</text><text x="64" y="286" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">atau SKB</text><text x="394" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Pendidikan nonformal kesetaraan</text><text x="774" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Dapat diusulkan PIP bila memenuhi</text><text x="774" y="286" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">kriteria ekonomi</text><rect x="48" y="306" width="1104" height="78" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Sekolahrumah komunitas</text><text x="64" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">berizin</text><text x="394" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Pasal 6 ayat (4) Permendikbud</text><text x="394" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">129/2014</text><text x="774" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Tanyakan apakah murid tercatat di</text><text x="774" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Dapodik</text><rect x="48" y="384" width="1104" height="78" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Sekolahrumah tunggal atau</text><text x="64" y="442" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">majemuk terdaftar di dinas</text><text x="394" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Pasal 6 ayat (1) Permendikbud</text><text x="394" y="442" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">129/2014</text><text x="774" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Tanyakan ke dinas jalur pendataan</text><text x="774" y="442" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">dan usulan bantuan</text><rect x="48" y="462" width="1104" height="78" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Belajar di rumah tanpa</text><text x="64" y="520" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">pendaftaran</text><text x="394" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Belum memenuhi kewajiban</text><text x="394" y="520" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">pendaftaran</text><text x="774" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Daftarkan dulu agar hak dan</text><text x="774" y="520" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">bantuan bisa diakses</text>
<text x="1152" y="738" text-anchor="end" font-family="Poppins, Arial, sans-serif" font-size="18" fill="#7A84A3">Diagram: Tim YUKA (yukaindonesia.com)</text>
</svg>
