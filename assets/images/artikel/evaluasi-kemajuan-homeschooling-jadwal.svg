t-weight="700" fill="#2B3A67">Semester</text><text x="284" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Rangkum kemajuan tiap mata pelajaran</text><text x="804" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Laporan deskriptif</text><rect x="48" y="436" width="1104" height="52" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="468" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Akhir jenjang</text><text x="284" y="468" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Siapkan bukti untuk lembaga dan tes</text><text x="804" y="468" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Berkas penyetaraan</text>
