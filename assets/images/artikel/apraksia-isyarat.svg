<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Isyarat yang dipakai saat terapi">
<rect width="1200" height="760" fill="#F7F8FC"/>
<rect width="1200" height="96" fill="#2B3A67"/>
<rect y="96" width="1200" height="6" fill="#FFD700"/>
<text x="48" y="58" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Isyarat yang dipakai saat terapi</text>
<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="22" fill="#4A5578">Isyarat sentuhan dan visual dicontohkan ASHA; detail latihan dari terapis anak</text>
<rect x="48" y="176" width="255" height="308" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="3"/><rect x="48" y="176" width="255" height="78" rx="18" fill="#2B3A67"/><rect x="48" y="226" width="255" height="28" fill="#2B3A67"/><text x="70" y="210" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Isyarat sentuhan</text><circle cx="74" cy="285" r="6" fill="#2B3A67"/><text x="90" y="292" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Jari di bibir saat</text><text x="90" y="318" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">bunyi p</text><circle cx="74" cy="353" r="6" fill="#2B3A67"/><text x="90" y="360" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Mengingatkan bibir</text><text x="90" y="386" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">menutup</text><circle cx="74" cy="421" r="6" fill="#2B3A67"/><text x="90" y="428" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Dilakukan berulang</text><rect x="331" y="176" width="255" height="308" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="3"/><rect x="331" y="176" width="255" height="78" rx="18" fill="#2B3A67"/><rect x="331" y="226" width="255" height="28" fill="#2B3A67"/><text x="353" y="210" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Isyarat visual</text><circle cx="357" cy="285" r="6" fill="#2B3A67"/><text x="373" y="292" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Melihat cermin saat</text><text x="373" y="318" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">berkata</text><circle cx="357" cy="353" r="6" fill="#2B3A67"/><text x="373" y="360" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Memperhatikan gerak</text><text x="373" y="386" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">mulut</text><circle cx="357" cy="421" r="6" fill="#2B3A67"/><text x="373" y="428" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Diulang dengan sabar</text><rect x="614" y="176" width="255" height="308" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="3"/><rect x="614" y="176" width="255" height="78" rx="18" fill="#2B3A67"/><rect x="614" y="226" width="255" height="28" fill="#2B3A67"/><text x="636" y="210" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Latihan bertahap</text><circle cx="640" cy="285" r="6" fill="#2B3A67"/><text x="656" y="292" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Suku kata ke kata</text><circle cx="640" cy="327" r="6" fill="#2B3A67"/><text x="656" y="334" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Kata pendek ke kata</text><text x="656" y="360" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">panjang</text><circle cx="640" cy="395" r="6" fill="#2B3A67"/><text x="656" y="402" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Kata ke kalimat</text><rect x="897" y="176" width="255" height="308" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="3"/><rect x="897" y="176" width="255" height="78" rx="18" fill="#2B3A67"/><rect x="897" y="226" width="255" height="28" fill="#2B3A67"/><text x="919" y="210" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Latihan di rumah</text><circle cx="923" cy="285" r="6" fill="#2B3A67"/><text x="939" y="292" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Singkat dan</text><text x="939" y="318" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">menyenangkan</text><circle cx="923" cy="353" r="6" fill="#2B3A67"/><text x="939" y="360" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Istirahat saat anak</text><text x="939" y="386" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">lelah</text><circle cx="923" cy="421" r="6" fill="#2B3A67"/><text x="939" y="428" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Cerita ke terapis</text>
<text x="1152" y="738" text-anchor="end" font-family="Poppins, Arial, sans-serif" font-size="18" fill="#7A84A3">Diagram: Tim YUKA (yukaindonesia.com)</text>
