<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Indikator dan bukti yang bisa dicek orang tua">
<rect width="1200" height="760" fill="#F7F8FC"/>
<rect width="1200" height="96" fill="#2B3A67"/>
<rect y="96" width="1200" height="6" fill="#FFD700"/>
<text x="48" y="58" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Indikator dan bukti yang bisa dicek orang tua</text>
<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="22" fill="#4A5578">Contoh turunan dari Permendikbudristek 48/2023 dan Index for Inclusion</text>
<rect x="48" y="172" width="1104" height="56" fill="#2B3A67"/><text x="64" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Area</text><text x="294" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Indikator</text><text x="734" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Bukti yang bisa diminta</text><rect x="48" y="228" width="1104" height="78" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Asesmen</text><text x="294" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Akomodasi berdasar asesmen fungsional</text><text x="734" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Ringkasan hasil asesmen dan</text><text x="734" y="286" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">rekomendasi</text><rect x="48" y="306" width="1104" height="52" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Perencanaan</text><text x="294" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Ada rencana pembelajaran individual</text><text x="734" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Dokumen PPI dengan target terukur</text><rect x="48" y="358" width="1104" height="78" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="390" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Guru</text><text x="294" y="390" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Guru mendapat pelatihan pendidikan</text><text x="294" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">khusus</text><text x="734" y="390" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Jadwal pelatihan, pendampingan GPK</text><rect x="48" y="436" width="1104" height="52" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="468" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Partisipasi</text><text x="294" y="468" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Anak ikut kegiatan kelas dan sekolah</text><text x="734" y="468" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Jadwal, foto kegiatan, catatan guru</text><rect x="48" y="488" width="1104" height="52" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="520" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Kemajuan</text><text x="294" y="520" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Target individual dipantau berkala</text><text x="734" y="520" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Laporan deskriptif dan grafik capaian</text>
<text x="1152" y="738" text-anchor="end" font-family="Poppins, Arial, sans-serif" font-size="18" fill="#7A84A3">Diagram: Tim YUKA (yukaindonesia.com)</text>
</svg>
