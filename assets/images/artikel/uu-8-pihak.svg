<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Pihak dan pertanyaan kunci">
<rect width="1200" height="760" fill="#F7F8FC"/>
<rect width="1200" height="96" fill="#2B3A67"/>
<rect y="96" width="1200" height="6" fill="#FFD700"/>
<text x="48" y="58" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Pihak dan pertanyaan kunci</text>
<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="22" fill="#4A5578">Pembagian peran membantu rapat sekolah menjadi konkret</text>
<rect x="48" y="172" width="1104" height="56" fill="#2B3A67"/><text x="64" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Pihak</text><text x="324" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Peran yang perlu ditanyakan</text><text x="794" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Bukti tindak lanjut</text><rect x="48" y="228" width="1104" height="78" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Peserta didik</text><text x="324" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Apa tujuan, preferensi, dan hambatan</text><text x="324" y="286" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">yang dirasakan?</text><text x="794" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Kesepakatan dukungan yang</text><text x="794" y="286" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">dipahami anak.</text><rect x="48" y="306" width="1104" height="78" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Keluarga</text><text x="324" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Informasi apa yang membantu sekolah</text><text x="324" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">memahami rutinitas?</text><text x="794" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Catatan kebutuhan dan komunikasi</text><text x="794" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">tertulis.</text><rect x="48" y="384" width="1104" height="78" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Sekolah</text><text x="324" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Akomodasi apa yang tersedia dan siapa</text><text x="324" y="442" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">koordinatornya?</text><text x="794" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Rencana layanan dan jadwal</text><text x="794" y="442" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">evaluasi.</text><rect x="48" y="462" width="1104" height="78" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Pemerintah daerah</text><text x="324" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Fasilitasi apa yang dapat diakses</text><text x="324" y="520" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">sekolah?</text><text x="794" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Rujukan layanan atau dukungan</text><text x="794" y="520" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">ULD.</text>
<text x="1152" y="738" text-anchor="end" font-family="Poppins, Arial, sans-serif" font-size="18" fill="#7A84A3">Diagram: Tim YUKA (yukaindonesia.com)</text>
</svg>
