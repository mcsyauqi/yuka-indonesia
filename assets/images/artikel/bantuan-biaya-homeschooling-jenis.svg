<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Tiga jenis bantuan biaya homeschooling">
<rect width="1200" height="760" fill="#F7F8FC"/>
<rect width="1200" height="96" fill="#2B3A67"/>
<rect y="96" width="1200" height="6" fill="#FFD700"/>
<text x="48" y="58" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Tiga jenis bantuan biaya homeschooling</text>
<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="22" fill="#4A5578">Bedakan bantuan untuk murid, untuk lembaga, dan dari masyarakat</text>
<rect x="48" y="176" width="349.3333333333333" height="402" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="3"/><rect x="48" y="176" width="349.3333333333333" height="78" rx="18" fill="#2B3A67"/><rect x="48" y="226" width="349.3333333333333" height="28" fill="#2B3A67"/><text x="70" y="210" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Untuk murid: PIP</text><circle cx="74" cy="285" r="6" fill="#2B3A67"/><text x="90" y="292" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Bantuan tunai untuk biaya</text><text x="90" y="318" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">personal pendidikan</text><circle cx="74" cy="353" r="6" fill="#2B3A67"/><text x="90" y="360" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Mencakup Paket A, B, dan C</text><circle cx="74" cy="395" r="6" fill="#2B3A67"/><text x="90" y="402" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Murid harus tercatat di</text><text x="90" y="428" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Dapodik satuan pendidikan</text><circle cx="74" cy="463" r="6" fill="#2B3A67"/><text x="90" y="470" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Diusulkan dan ditandai</text><text x="90" y="496" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">layak oleh satuan</text><text x="90" y="522" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">pendidikan</text><rect x="425.3333333333333" y="176" width="349.3333333333333" height="402" rx="18" fill="#FFFFFF" stroke="#00838F" stroke-width="3"/><rect x="425.3333333333333" y="176" width="349.3333333333333" height="78" rx="18" fill="#00838F"/><rect x="425.3333333333333" y="226" width="349.3333333333333" height="28" fill="#00838F"/><text x="447.3333333333333" y="210" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Untuk lembaga: BOP</text><circle cx="451.3333333333333" cy="285" r="6" fill="#00838F"/><text x="467.3333333333333" y="292" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Dana operasional bagi PKBM</text><text x="467.3333333333333" y="318" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">atau SKB penyelenggara</text><text x="467.3333333333333" y="344" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">kesetaraan</text><circle cx="451.3333333333333" cy="379" r="6" fill="#00838F"/><text x="467.3333333333333" y="386" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Diterima lembaga, bukan</text><text x="467.3333333333333" y="412" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">keluarga</text><circle cx="451.3333333333333" cy="447" r="6" fill="#00838F"/><text x="467.3333333333333" y="454" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Ikut menentukan layanan</text><text x="467.3333333333333" y="480" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">yang bisa diberikan lembaga</text><rect x="802.6666666666666" y="176" width="349.3333333333333" height="402" rx="18" fill="#FFFFFF" stroke="#7A5A06" stroke-width="3"/><rect x="802.6666666666666" y="176" width="349.3333333333333" height="78" rx="18" fill="#7A5A06"/><rect x="802.6666666666666" y="226" width="349.3333333333333" height="28" fill="#7A5A06"/><text x="824.6666666666666" y="210" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Dari masyarakat</text><circle cx="828.6666666666666" cy="285" r="6" fill="#7A5A06"/><text x="844.6666666666666" y="292" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Zakat dan infak pendidikan</text><circle cx="828.6666666666666" cy="327" r="6" fill="#7A5A06"/><text x="844.6666666666666" y="334" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Beasiswa yayasan atau</text><text x="844.6666666666666" y="360" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">perusahaan</text><circle cx="828.6666666666666" cy="395" r="6" fill="#7A5A06"/><text x="844.6666666666666" y="402" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Donasi komunitas dan</text><text x="844.6666666666666" y="428" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">program CSR</text><circle cx="828.6666666666666" cy="463" r="6" fill="#7A5A06"/><text x="844.6666666666666" y="470" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Syarat berbeda di tiap</text><text x="844.6666666666666" y="496" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">lembaga</text>
<text x="1152" y="738" text-anchor="end" font-family="Poppins, Arial, sans-serif" font-size="18" fill="#7A84A3">Diagram: Tim YUKA (yukaindonesia.com)</text>
</svg>
