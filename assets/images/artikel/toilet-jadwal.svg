<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Contoh catatan harian sederhana">
<rect width="1200" height="760" fill="#F7F8FC"/>
<rect width="1200" height="96" fill="#2B3A67"/>
<rect y="96" width="1200" height="6" fill="#FFD700"/>
<text x="48" y="58" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Contoh catatan harian sederhana</text>
<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="22" fill="#4A5578">Catatan dipakai untuk melihat pola, bukan untuk menilai anak</text>
<rect x="48" y="172" width="1104" height="56" fill="#2B3A67"/><text x="64" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Waktu</text><text x="324" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Yang dicatat</text><text x="754" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Yang dibaca dari catatan</text><rect x="48" y="228" width="1104" height="78" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Bangun tidur</text><text x="324" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Popok kering atau basah</text><text x="754" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Apakah anak mulai bisa menahan</text><text x="754" y="286" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">semalam.</text><rect x="48" y="306" width="1104" height="78" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Tiap dua jam</text><text x="324" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Hasil saat diajak ke toilet</text><text x="754" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Jam berapa peluang berhasil paling</text><text x="754" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">besar.</text><rect x="48" y="384" width="1104" height="78" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Setelah makan</text><text x="324" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Buang air besar atau tidak</text><text x="754" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Pola waktu yang bisa dijadikan</text><text x="754" y="442" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">jadwal tetap.</text><rect x="48" y="462" width="1104" height="78" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Sore hari</text><text x="324" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Jumlah kejadian basah</text><text x="754" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Apakah hari itu terlalu padat atau</text><text x="754" y="520" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">terlalu lelah.</text>
<text x="1152" y="738" text-anchor="end" font-family="Poppins, Arial, sans-serif" font-size="18" fill="#7A84A3">Diagram: Tim YUKA (yukaindonesia.com)</text>
</svg>
