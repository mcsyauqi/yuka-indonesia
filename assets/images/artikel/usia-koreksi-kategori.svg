<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Kategori kelahiran prematur menurut WHO">
<rect width="1200" height="760" fill="#F7F8FC"/>
<rect width="1200" height="96" fill="#2B3A67"/>
<rect y="96" width="1200" height="6" fill="#FFD700"/>
<text x="48" y="58" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Kategori kelahiran prematur menurut WHO</text>
<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="22" fill="#4A5578">Berdasarkan usia kehamilan saat bayi lahir</text>
<rect x="48" y="172" width="1104" height="56" fill="#2B3A67"/><text x="64" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Kategori</text><text x="444" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Usia kehamilan saat lahir</text><text x="824" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Selisih dari 40 minggu</text><rect x="48" y="228" width="1104" height="52" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Sangat sangat prematur</text><text x="444" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Kurang dari 28 minggu</text><text x="824" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Lebih dari 12 minggu</text><rect x="48" y="280" width="1104" height="52" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="312" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Sangat prematur</text><text x="444" y="312" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">28 sampai kurang dari 32 minggu</text><text x="824" y="312" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Lebih dari 8 sampai 12 minggu</text><rect x="48" y="332" width="1104" height="52" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Prematur sedang sampai akhir</text><text x="444" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">32 sampai 37 minggu</text><text x="824" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Sekitar 3 sampai 8 minggu</text>
<text x="1152" y="738" text-anchor="end" font-family="Poppins, Arial, sans-serif" font-size="18" fill="#7A84A3">Diagram: Tim YUKA (yukaindonesia.com)</text>
