<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Spektrum layanan pendidikan ABK">
<rect width="1200" height="760" fill="#F7F8FC"/>
<rect width="1200" height="96" fill="#2B3A67"/>
<rect y="96" width="1200" height="6" fill="#FFD700"/>
<text x="48" y="58" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Spektrum layanan pendidikan ABK</text>
<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="22" fill="#4A5578">Dari kelas reguler penuh sampai layanan terpisah</text>
<rect x="48" y="176" width="349.3333333333333" height="334" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="3"/><rect x="48" y="176" width="349.3333333333333" height="78" rx="18" fill="#2B3A67"/><rect x="48" y="226" width="349.3333333333333" height="28" fill="#2B3A67"/><text x="70" y="210" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Inklusi penuh</text><circle cx="74" cy="285" r="6" fill="#2B3A67"/><text x="90" y="292" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Belajar di kelas reguler</text><text x="90" y="318" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">hampir sepanjang waktu</text><circle cx="74" cy="353" r="6" fill="#2B3A67"/><text x="90" y="360" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Dukungan dibawa ke dalam</text><text x="90" y="386" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">kelas</text><circle cx="74" cy="421" r="6" fill="#2B3A67"/><text x="90" y="428" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Guru pendamping, materi dan</text><text x="90" y="454" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">penilaian disesuaikan</text><rect x="425.3333333333333" y="176" width="349.3333333333333" height="334" rx="18" fill="#FFFFFF" stroke="#00BCD4" stroke-width="3"/><rect x="425.3333333333333" y="176" width="349.3333333333333" height="78" rx="18" fill="#00BCD4"/><rect x="425.3333333333333" y="226" width="349.3333333333333" height="28" fill="#00BCD4"/><text x="447.3333333333333" y="210" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Inklusi parsial</text><circle cx="451.3333333333333" cy="285" r="6" fill="#00BCD4"/><text x="467.3333333333333" y="292" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Sebagian waktu di kelas</text><text x="467.3333333333333" y="318" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">reguler</text><circle cx="451.3333333333333" cy="353" r="6" fill="#00BCD4"/><text x="467.3333333333333" y="360" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Sebagian di ruang sumber</text><text x="467.3333333333333" y="386" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">atau kelas khusus</text><circle cx="451.3333333333333" cy="421" r="6" fill="#00BCD4"/><text x="467.3333333333333" y="428" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Porsi ditinjau berkala</text><text x="467.3333333333333" y="454" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">sesuai kemajuan</text><rect x="802.6666666666666" y="176" width="349.3333333333333" height="334" rx="18" fill="#FFFFFF" stroke="#E53935" stroke-width="3"/><rect x="802.6666666666666" y="176" width="349.3333333333333" height="78" rx="18" fill="#E53935"/><rect x="802.6666666666666" y="226" width="349.3333333333333" height="28" fill="#E53935"/><text x="824.6666666666666" y="210" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Layanan terpisah</text><circle cx="828.6666666666666" cy="285" r="6" fill="#E53935"/><text x="844.6666666666666" y="292" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Belajar di kelas atau</text><text x="844.6666666666666" y="318" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">sekolah khusus</text><circle cx="828.6666666666666" cy="353" r="6" fill="#E53935"/><text x="844.6666666666666" y="360" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Kegiatan bersama teman</text><text x="844.6666666666666" y="386" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">reguler terbatas</text><circle cx="828.6666666666666" cy="421" r="6" fill="#E53935"/><text x="844.6666666666666" y="428" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Dipilih bila kebutuhan</text><text x="844.6666666666666" y="454" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">sangat intensif</text>
<text x="1152" y="738" text-anchor="end" font-family="Poppins, Arial, sans-serif" font-size="18" fill="#7A84A3">Diagram: Tim YUKA (yukaindonesia.com)</text>
