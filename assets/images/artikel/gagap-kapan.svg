<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Kapan anak gagap perlu dievaluasi">
<rect width="1200" height="760" fill="#F7F8FC"/>
<rect width="1200" height="96" fill="#2B3A67"/>
<rect y="96" width="1200" height="6" fill="#FFD700"/>
<text x="48" y="58" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Kapan anak gagap perlu dievaluasi</text>
<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="22" fill="#4A5578">Rangkuman anjuran NIDCD, MedlinePlus, dan NHS</text>
<rect x="48" y="172" width="1104" height="56" fill="#2B3A67"/><text x="64" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Tanda</text><text x="444" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Keterangan</text><text x="904" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Sumber</text><rect x="48" y="228" width="1104" height="52" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Gagap 3 sampai 6 bulan atau lebih</text><text x="444" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Tidak membaik setelah beberapa bulan</text><text x="904" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">NIDCD, MedlinePlus</text><rect x="48" y="280" width="1104" height="78" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="312" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Perilaku bergulat</text><text x="444" y="312" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Tampak berusaha keras, tegang, malu saat</text><text x="444" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">gagap</text><text x="904" y="312" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">NIDCD, MedlinePlus</text><rect x="48" y="358" width="1104" height="52" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="390" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Riwayat keluarga</text><text x="444" y="390" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Ada anggota keluarga yang gagap</text><text x="904" y="390" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">NIDCD, MedlinePlus</text><rect x="48" y="410" width="1104" height="52" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="442" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Blok berlangsung beberapa detik</text><text x="444" y="442" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Kata tersangkut cukup lama</text><text x="904" y="442" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">MedlinePlus</text><rect x="48" y="462" width="1104" height="52" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Masih gagap setelah usia 6 tahun</text><text x="444" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Lebih mungkin menetap sampai dewasa</text><text x="904" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">MedlinePlus</text>
<text x="1152" y="738" text-anchor="end" font-family="Poppins, Arial, sans-serif" font-size="18" fill="#7A84A3">Diagram: Tim YUKA (yukaindonesia.com)</text>
</svg>
