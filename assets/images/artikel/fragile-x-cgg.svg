<rect x="48" y="172" width="1104" height="56" fill="#2B3A67"/><text x="64" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Kategori</text><text x="364" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Jumlah pengulangan CGG</text><text x="744" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Artinya</text><rect x="48" y="228" width="1104" height="52" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Normal</text><text x="364" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Sekitar 5 sampai 40</text><text x="744" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Gen bekerja seperti biasa</text><rect x="48" y="280" width="1104" height="78" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="312" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Premutasi</text><text x="364" y="312" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">55 sampai 200</text><text x="744" y="312" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Pembawa, risiko kondisi terkait</text><text x="744" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">fragile X</text><rect x="48" y="358" width="1104" height="52" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="390" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Sindrom fragile X</text><text x="364" y="390" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Lebih dari 200</text><text x="744" y="390" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Protein FMRP tidak dibuat</text>
