<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Tahapan bicara anak bilingual">
<rect width="1200" height="760" fill="#F7F8FC"/>
<rect width="1200" height="96" fill="#2B3A67"/>
<rect y="96" width="1200" height="6" fill="#FFD700"/>
<text x="48" y="58" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Tahapan bicara anak bilingual</text>
<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="22" fill="#4A5578">Patokan sama dengan anak satu bahasa, kosakata dihitung dari semua bahasa</text>
<rect x="48" y="172" width="1104" height="56" fill="#2B3A67"/><text x="64" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Usia</text><text x="294" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Kemampuan yang biasa muncul</text><text x="724" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Catatan untuk anak dwibahasa</text><rect x="48" y="228" width="1104" height="78" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Sekitar 12 bulan</text><text x="294" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Kata pertama; satu atau dua kata</text><text x="724" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Kata pertama boleh dari bahasa mana</text><text x="724" y="286" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">saja</text><rect x="48" y="306" width="1104" height="78" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">18 bulan</text><text x="294" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Mencoba 3 kata atau lebih selain mama</text><text x="294" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">dan papa</text><text x="724" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Hitung kata dari semua bahasa</text><rect x="48" y="384" width="1104" height="52" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">24 bulan</text><text x="294" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Frasa dua kata, misalnya mau susu</text><text x="724" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Frasa boleh campuran dua bahasa</text><rect x="48" y="436" width="1104" height="78" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="468" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Sekitar 3 tahun</text><text x="294" y="468" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Frasa 2 sampai 3 kata untuk meminta</text><text x="294" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">sesuatu</text><text x="724" y="468" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Mulai memisahkan bahasa sesuai lawan</text><text x="724" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">bicara</text><rect x="48" y="514" width="1104" height="78" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="546" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">3 sampai 4 tahun</text><text x="294" y="546" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Kalimat 4 kata atau lebih</text><text x="724" y="546" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Bahasa yang lebih sering dipakai bisa</text><text x="724" y="572" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">lebih kuat</text>
<text x="1152" y="738" text-anchor="end" font-family="Poppins, Arial, sans-serif" font-size="18" fill="#7A84A3">Diagram: Tim YUKA (yukaindonesia.com)</text>
</svg>
