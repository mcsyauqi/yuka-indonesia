<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Tiga tahap teknik tell-show-do: jelaskan, perlihatkan, lakukan">
<rect width="1200" height="760" fill="#F7F8FC"/>
<rect width="1200" height="96" fill="#2B3A67"/>
<rect y="96" width="1200" height="6" fill="#FFD700"/>
<text x="48" y="60" font-family="Poppins, Arial, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="start">Teknik tell-show-do di kursi periksa</text>
<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="400" fill="#4A5578" text-anchor="start">Teknik dasar dalam pedoman AAPD untuk mengurangi rasa takut anak</text>
<rect x="48" y="180" width="352" height="470" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/><rect x="48" y="180" width="352" height="110" rx="18" fill="#2B3A67"/><rect x="48" y="260" width="352" height="30" fill="#2B3A67"/><text x="76" y="238" font-family="Poppins, Arial, sans-serif" font-size="40" font-weight="700" fill="#FFD700" text-anchor="start">TELL</text><text x="76" y="276" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="start">Jelaskan</text><text x="76" y="336" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="400" fill="#333B57" text-anchor="start">Dokter menjelaskan tindakan</text><text x="76" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="400" fill="#333B57" text-anchor="start">dengan kalimat yang sesuai</text><text x="76" y="392" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="400" fill="#333B57" text-anchor="start">tingkat perkembangan anak.</text><rect x="68" y="510" width="312" height="120" rx="12" fill="#FFF8D6"/><text x="84" y="546" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="600" fill="#333B57" text-anchor="start">Contoh: "Sekarang gigimu</text><text x="84" y="571" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="600" fill="#333B57" text-anchor="start">dihitung pakai kaca kecil."</text><path d="M404 415 h16 m-8 -8 l8 8 l-8 8" stroke="#E53935" stroke-width="4" fill="none"/><rect x="424" y="180" width="352" height="470" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/><rect x="424" y="180" width="352" height="110" rx="18" fill="#00BCD4"/><rect x="424" y="260" width="352" height="30" fill="#00BCD4"/><text x="452" y="238" font-family="Poppins, Arial, sans-serif" font-size="40" font-weight="700" fill="#FFD700" text-anchor="start">SHOW</text><text x="452" y="276" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="start">Perlihatkan</text><text x="452" y="336" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="400" fill="#333B57" text-anchor="start">Anak melihat, mendengar,</text><text x="452" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="400" fill="#333B57" text-anchor="start">mencium, dan menyentuh alatnya</text><text x="452" y="392" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="400" fill="#333B57" text-anchor="start">di tempat yang aman.</text><rect x="444" y="510" width="312" height="120" rx="12" fill="#FFF8D6"/><text x="460" y="546" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="600" fill="#333B57" text-anchor="start">Mulai dari benda yang dikenal</text><text x="460" y="571" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="600" fill="#333B57" text-anchor="start">anak, seperti sikat gigi.</text><path d="M780 415 h16 m-8 -8 l8 8 l-8 8" stroke="#E53935" stroke-width="4" fill="none"/><rect x="800" y="180" width="352" height="470" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/><rect x="800" y="180" width="352" height="110" rx="18" fill="#5C6BC0"/><rect x="800" y="260" width="352" height="30" fill="#5C6BC0"/><text x="828" y="238" font-family="Poppins, Arial, sans-serif" font-size="40" font-weight="700" fill="#FFD700" text-anchor="start">DO</text><text x="828" y="276" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="start">Lakukan</text><text x="828" y="336" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="400" fill="#333B57" text-anchor="start">Dokter melakukan tindakan</text><text x="828" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="400" fill="#333B57" text-anchor="start">persis seperti yang sudah</text><text x="828" y="392" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="400" fill="#333B57" text-anchor="start">dijelaskan dan diperlihatkan.</text><rect x="820" y="510" width="312" height="120" rx="12" fill="#FFF8D6"/><text x="836" y="546" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="600" fill="#333B57" text-anchor="start">Tidak ada kejutan: yang</text><text x="836" y="571" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="600" fill="#333B57" text-anchor="start">dilakukan sama dengan yang</text><text x="836" y="596" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="600" fill="#333B57" text-anchor="start">diceritakan.</text>
<text x="48" y="736" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="400" fill="#4A5578" text-anchor="start">Sumber: AAPD, Behavior Guidance for the Pediatric Dental Patient; NIDCR, Practical Oral Care for People With Autism</text>
</svg>