<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Tanda yang perlu ditindaklanjuti">
<rect width="1200" height="760" fill="#F7F8FC"/>
<rect width="1200" height="96" fill="#2B3A67"/>
<rect y="96" width="1200" height="6" fill="#FFD700"/>
<text x="48" y="58" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Tanda yang perlu ditindaklanjuti</text>
<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="22" fill="#4A5578">Tanda bukan bukti, tetapi alasan untuk bertanya dan mengamati</text>
<rect x="48" y="172" width="1104" height="56" fill="#2B3A67"/><text x="64" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Yang terlihat</text><text x="364" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Kemungkinan yang perlu dicek</text><text x="794" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Langkah pertama</text><rect x="48" y="228" width="1104" height="78" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Menolak berangkat</text><text x="364" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Ada situasi yang dihindari di sekolah</text><text x="794" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Tanyakan bagian hari yang paling</text><text x="794" y="286" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">tidak disukai.</text><rect x="48" y="306" width="1104" height="78" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Barang sering hilang</text><text x="364" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Barang diambil atau dirusak orang</text><text x="364" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">lain</text><text x="794" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Catat tanggal dan benda, minta</text><text x="794" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">sekolah mengecek.</text><rect x="48" y="384" width="1104" height="78" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Tidur dan makan berubah</text><text x="364" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Tekanan emosional yang belum terucap</text><text x="794" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Beri waktu bercerita, hubungi</text><text x="794" y="442" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">tenaga kesehatan bila menetap.</text><rect x="48" y="462" width="1104" height="78" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Menarik diri dari teman</text><text x="364" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Dikeluarkan dari kelompok</text><text x="794" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Tanyakan pada guru siapa teman</text><text x="794" y="520" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">duduk dan teman mainnya.</text>
<text x="1152" y="738" text-anchor="end" font-family="Poppins, Arial, sans-serif" font-size="18" fill="#7A84A3">Diagram: Tim YUKA (yukaindonesia.com)</text>
</svg>
