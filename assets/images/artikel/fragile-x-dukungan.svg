, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">keluarga</text><circle cx="923" cy="285" r="6" fill="#2B3A67"/><text x="939" y="292" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Pemantauan kejang</text><circle cx="923" cy="327" r="6" fill="#2B3A67"/><text x="939" y="334" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Konseling genetik</text><circle cx="923" cy="369" r="6" fill="#2B3A67"/><text x="939" y="376" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Dukungan untuk orang</text><text x="939" y="402" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">tua</text>
