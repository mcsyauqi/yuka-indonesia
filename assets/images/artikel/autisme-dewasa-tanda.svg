Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Cara tetap dalam melakukan</text><text x="467.3333333333333" y="318" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">sesuatu</text><circle cx="451.3333333333333" cy="353" r="6" fill="#2B3A67"/><text x="467.3333333333333" y="360" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Gelisah saat rutinitas</text><text x="467.3333333333333" y="386" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">berubah</text><circle cx="451.3333333333333" cy="421" r="6" fill="#2B3A67"/><text x="467.3333333333333" y="428" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Gerakan berulang (stimming)</text><circle cx="451.3333333333333" cy="463" r="6" fill="#2B3A67"/><text x="467.3333333333333" y="470" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Minat yang sangat mendalam</text><rect x="802.6666666666666" y="176" width="349.3333333333333" height="376" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="3"/><rect x="802.6666666666666" y="176" width="349.3333333333333" height="78" rx="18" fill="#2B3A67"/><rect x="802.6666666666666" y="226" width="349.3333333333333" height="28" fill="#2B3A67"/><text x="824.6666666666666" y="210" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Sensorik dan dampak</text><circle cx="828.6666666666666" cy="285" r="6" fill="#2B3A67"/><text x="844.6666666666666" y="292" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Sangat peka atau kurang</text><text x="844.6666666666666" y="318" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">peka terhadap suara,</text><text x="844.6666666666666" y="344" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">cahaya, bau</text><circle cx="828.6666666666666" cy="379" r="6" fill="#2B3A67"/><text x="844.6666666666666" y="386" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Kelelahan karena masking</text><circle cx="828.6666666666666" cy="421" r="6" fill="#2B3A67"/><text x="844.6666666666666" y="428" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Masalah kesehatan mental</text><circle cx="828.6666666666666" cy="463" r="6" fill="#2B3A67"/><text x="844.6666666666666" y="470" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Kesulitan bertahan di</text><text x="844.6666666666666" y="496" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">sekolah atau pekerjaan</text>
