<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Satuan Kredit Kompetensi (SKK) pendidikan kesetaraan">
<rect width="1200" height="760" fill="#F7F8FC"/>
<rect width="1200" height="96" fill="#2B3A67"/>
<rect y="96" width="1200" height="6" fill="#FFD700"/>
<text x="48" y="58" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Satuan Kredit Kompetensi (SKK) pendidikan kesetaraan</text>
<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="22" fill="#4A5578">Menurut struktur kurikulum kesetaraan dalam Permendikdasmen 13/2025</text>
<rect x="48" y="172" width="1104" height="56" fill="#2B3A67"/><text x="64" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Unsur</text><text x="294" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Ketentuan</text><text x="764" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Makna bagi keluarga</text><rect x="48" y="228" width="1104" height="78" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">1 SKK</text><text x="294" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">1 jam tatap muka, atau 2 jam tutorial,</text><text x="294" y="286" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">atau 3 jam belajar mandiri</text><text x="764" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Belajar mandiri di rumah diakui</text><text x="764" y="286" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">dengan bobot jam lebih banyak</text><rect x="48" y="306" width="1104" height="78" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Jam tatap muka</text><text x="294" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">35 menit Paket A, 40 menit Paket B, 45</text><text x="294" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">menit Paket C</text><text x="764" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Sesuaikan durasi sesi dengan</text><text x="764" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">jenjang anak</text><rect x="48" y="384" width="1104" height="78" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Paket A total</text><text x="294" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">64, 78, dan 78 SKK untuk Fase A, B, C</text><text x="294" y="442" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">(220 SKK)</text><text x="764" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Termasuk muatan lokal paling banyak</text><text x="764" y="442" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">2 SKK per fase</text><rect x="48" y="462" width="1104" height="78" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Pemberdayaan dan</text><text x="64" y="520" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">keterampilan</text><text x="294" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">14 SKK per fase pada Paket A (gabungan)</text><text x="764" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Ruang untuk keterampilan hidup dan</text><text x="764" y="520" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">kemandirian</text>
<text x="1152" y="738" text-anchor="end" font-family="Poppins, Arial, sans-serif" font-size="18" fill="#7A84A3">Diagram: Tim YUKA (yukaindonesia.com)</text>
</svg>
