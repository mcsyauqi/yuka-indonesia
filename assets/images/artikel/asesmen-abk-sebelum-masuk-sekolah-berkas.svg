<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Berkas yang membantu asesmen">
<rect width="1200" height="760" fill="#F7F8FC"/>
<rect width="1200" height="96" fill="#2B3A67"/>
<rect y="96" width="1200" height="6" fill="#FFD700"/>
<text x="48" y="58" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Berkas yang membantu asesmen</text>
<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="22" fill="#4A5578">Bawa yang ada, tidak perlu menunggu semuanya lengkap</text>
<rect x="48" y="172" width="1104" height="56" fill="#2B3A67"/><text x="64" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Berkas</text><text x="364" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Isi yang dicari</text><text x="834" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Catatan</text><rect x="48" y="228" width="1104" height="78" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Catatan perkembangan</text><text x="364" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Usia mulai bicara, berjalan, makan</text><text x="364" y="286" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">sendiri, dan perubahan penting</text><text x="834" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Boleh berupa tulisan tangan</text><text x="834" y="286" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">orang tua</text><rect x="48" y="306" width="1104" height="78" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Laporan terapi atau klinik</text><text x="364" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Rekomendasi, alat bantu, dan strategi</text><text x="364" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">yang terbukti membantu</text><text x="834" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Bagikan sebatas yang relevan</text><text x="834" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">untuk belajar</text><rect x="48" y="384" width="1104" height="78" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Rapor atau catatan PAUD</text><text x="364" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Cara anak bergabung dalam kegiatan</text><text x="364" y="442" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">kelompok</text><text x="834" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Pengamatan guru sebelumnya</text><text x="834" y="442" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">sangat berharga</text><rect x="48" y="462" width="1104" height="78" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Kartu atau surat</text><text x="64" y="520" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">keterangan disabilitas</text><text x="364" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Syarat jalur afirmasi SPMB bagi</text><text x="364" y="520" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">penyandang disabilitas</text><text x="834" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Lihat Pasal 19 ayat (2)</text><text x="834" y="520" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Permendikdasmen 3/2025</text><rect x="48" y="540" width="1104" height="78" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="572" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Contoh karya dan video</text><text x="64" y="598" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">singkat</text><text x="364" y="572" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Cara anak berkomunikasi, bermain, dan</text><text x="364" y="598" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">menyelesaikan tugas</text><text x="834" y="572" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Minta izin anak dan jaga</text><text x="834" y="598" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">privasinya</text>
<text x="1152" y="738" text-anchor="end" font-family="Poppins, Arial, sans-serif" font-size="18" fill="#7A84A3">Diagram: Tim YUKA (yukaindonesia.com)</text>
</svg>
