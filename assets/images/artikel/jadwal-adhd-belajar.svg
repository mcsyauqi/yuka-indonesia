<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Blok belajar untuk anak ADHD">
<rect width="1200" height="760" fill="#F7F8FC"/>
<rect width="1200" height="96" fill="#2B3A67"/>
<rect y="96" width="1200" height="6" fill="#FFD700"/>
<text x="48" y="58" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Blok belajar untuk anak ADHD</text>
<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="22" fill="#4A5578">Contoh penerapan anjuran NHS dan CDC saat mengerjakan PR</text>
<rect x="48" y="176" width="534" height="250" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/><circle cx="86" cy="216" r="24" fill="#FFD700"/><text x="86" y="225" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="24" font-weight="700" fill="#2B3A67">1</text><text x="122" y="212" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#2B3A67">Siapkan meja</text><text x="72" y="284" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Matikan TV dan gawai, kurangi suara, sediakan</text><text x="72" y="311" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">meja yang bersih.</text><path d="M588 301 l24 0 m-10 -10 l10 10 l-10 10" stroke="#00BCD4" stroke-width="4" fill="none"/><rect x="618" y="176" width="534" height="250" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/><circle cx="656" cy="216" r="24" fill="#FFD700"/><text x="656" y="225" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="24" font-weight="700" fill="#2B3A67">2</text><text x="692" y="212" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#2B3A67">Pecah tugas</text><text x="642" y="284" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Bagi PR menjadi bagian kecil dan tulis</text><text x="642" y="311" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">urutannya di daftar.</text><rect x="48" y="466" width="534" height="250" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/><circle cx="86" cy="506" r="24" fill="#FFD700"/><text x="86" y="515" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="24" font-weight="700" fill="#2B3A67">3</text><text x="122" y="502" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#2B3A67">Kerja 15 sampai 20 menit</text><text x="72" y="574" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Satu bagian tugas, dengan instruksi singkat</text><text x="72" y="601" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">dan jelas.</text><path d="M588 591 l24 0 m-10 -10 l10 10 l-10 10" stroke="#00BCD4" stroke-width="4" fill="none"/><rect x="618" y="466" width="534" height="250" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/><circle cx="656" cy="506" r="24" fill="#FFD700"/><text x="656" y="515" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="24" font-weight="700" fill="#2B3A67">4</text><text x="692" y="502" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#2B3A67">Istirahat dan pujian</text><text x="642" y="574" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Jeda singkat untuk bergerak, beri pujian,</text><text x="642" y="601" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">lanjut ke bagian berikutnya.</text>
<text x="1152" y="738" text-anchor="end" font-family="Poppins, Arial, sans-serif" font-size="18" fill="#7A84A3">Diagram: Tim YUKA (yukaindonesia.com)</text>
</svg>
