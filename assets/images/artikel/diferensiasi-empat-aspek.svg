<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Empat aspek yang bisa didiferensiasi">
<rect width="1200" height="760" fill="#F7F8FC"/>
<rect width="1200" height="96" fill="#2B3A67"/>
<rect y="96" width="1200" height="6" fill="#FFD700"/>
<text x="48" y="58" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Empat aspek yang bisa didiferensiasi</text>
<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="22" fill="#4A5578">Tujuan belajarnya sama, jalannya disesuaikan</text>
<rect x="48" y="172" width="1104" height="56" fill="#2B3A67"/><text x="64" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Aspek</text><text x="264" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Pertanyaan guru</text><text x="644" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Contoh untuk anak ABK</text><rect x="48" y="228" width="1104" height="78" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Konten</text><text x="264" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Bahan apa yang dipakai?</text><text x="644" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Teks pendek bergambar, benda nyata, atau</text><text x="644" y="286" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">rekaman suara untuk materi yang sama.</text><rect x="48" y="306" width="1104" height="78" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Proses</text><text x="264" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Bagaimana anak mengolahnya?</text><text x="644" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Langkah dipecah kecil, contoh dikerjakan</text><text x="644" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">bersama, waktu lebih panjang.</text><rect x="48" y="384" width="1104" height="78" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Produk</text><text x="264" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Bagaimana anak menunjukkan paham?</text><text x="644" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Menjawab lisan, menunjuk gambar, membuat</text><text x="644" y="442" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">model, atau menulis singkat.</text><rect x="48" y="462" width="1104" height="78" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Lingkungan</text><text x="264" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Di mana dan bersama siapa?</text><text x="644" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Tempat duduk dekat guru, sudut tenang,</text><text x="644" y="520" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">kelompok yang disusun sengaja.</text>
<text x="1152" y="738" text-anchor="end" font-family="Poppins, Arial, sans-serif" font-size="18" fill="#7A84A3">Diagram: Tim YUKA (yukaindonesia.com)</text>
</svg>
