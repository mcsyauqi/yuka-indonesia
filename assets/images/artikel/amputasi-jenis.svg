<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Jenis kekurangan anggota gerak">
<rect width="1200" height="760" fill="#F7F8FC"/>
<rect width="1200" height="96" fill="#2B3A67"/>
<rect y="96" width="1200" height="6" fill="#FFD700"/>
<text x="48" y="58" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Jenis kekurangan anggota gerak</text>
<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="22" fill="#4A5578">Pembagian dasar menurut panduan surveilans CDC</text>
<rect x="48" y="172" width="1104" height="56" fill="#2B3A67"/><text x="64" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Jenis</text><text x="364" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Arti</text><text x="784" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Contoh</text><rect x="48" y="228" width="1104" height="78" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Transversal terminal</text><text x="364" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Bagian ujung anggota gerak tidak</text><text x="364" y="286" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">terbentuk sama sekali</text><text x="784" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Lengan berakhir di bawah siku</text><text x="784" y="286" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">tanpa tangan</text><rect x="48" y="306" width="1104" height="78" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Transversal interkalari</text><text x="364" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Bagian tengah hilang, bagian ujung</text><text x="364" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">tetap ada</text><text x="784" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Tangan ada tetapi lengan bawah</text><text x="784" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">sangat pendek</text><rect x="48" y="384" width="1104" height="78" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Longitudinal</text><text x="364" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Kekurangan sepanjang sumbu panjang</text><text x="364" y="442" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">anggota gerak</text><text x="784" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Tulang di sisi ibu jari atau</text><text x="784" y="442" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">kelingking tidak terbentuk</text>
<text x="1152" y="738" text-anchor="end" font-family="Poppins, Arial, sans-serif" font-size="18" fill="#7A84A3">Diagram: Tim YUKA (yukaindonesia.com)</text>
</svg>
