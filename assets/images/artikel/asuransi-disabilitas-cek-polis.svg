<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Lima hal yang dicek sebelum membeli polis">
<rect width="1200" height="760" fill="#F7F8FC"/>
<rect width="1200" height="96" fill="#2B3A67"/>
<rect y="96" width="1200" height="6" fill="#FFD700"/>
<text x="48" y="58" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Lima hal yang dicek sebelum membeli polis</text>
<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="22" fill="#4A5578">Minta jawaban tertulis dari perusahaan asuransi</text>
<rect x="48" y="172" width="1104" height="56" fill="#2B3A67"/><text x="64" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Yang dicek</text><text x="364" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Pertanyaan untuk perusahaan asuransi</text><rect x="48" y="228" width="1104" height="52" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Pengecualian</text><text x="364" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Apakah kondisi anak yang sudah ada dikecualikan dari manfaat?</text><rect x="48" y="280" width="1104" height="52" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="312" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Masa tunggu</text><text x="364" y="312" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Berapa lama sampai klaim untuk kondisi tertentu bisa diajukan?</text><rect x="48" y="332" width="1104" height="52" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Batas manfaat</text><text x="364" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Berapa batas per tahun dan per jenis layanan?</text><rect x="48" y="384" width="1104" height="52" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Jaringan</text><text x="364" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Apakah rumah sakit dan terapis langganan anak termasuk rekanan?</text><rect x="48" y="436" width="1104" height="52" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="468" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Koordinasi JKN</text><text x="364" y="468" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Bagaimana klaim dihitung bila anak juga peserta JKN?</text>
<text x="1152" y="738" text-anchor="end" font-family="Poppins, Arial, sans-serif" font-size="18" fill="#7A84A3">Diagram: Tim YUKA (yukaindonesia.com)</text>
</svg>
