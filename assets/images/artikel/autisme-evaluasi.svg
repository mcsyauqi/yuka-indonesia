<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Dari kekhawatiran menuju evaluasi">
<rect width="1200" height="760" fill="#F7F8FC"/>
<rect width="1200" height="96" fill="#2B3A67"/>
<rect y="96" width="1200" height="6" fill="#FFD700"/>
<text x="48" y="58" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Dari kekhawatiran menuju evaluasi</text>
<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="22" fill="#4A5578">Evaluasi menggabungkan riwayat perkembangan, observasi, dan kebutuhan fungsi</text>
<rect x="48" y="176" width="534" height="250" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/><circle cx="86" cy="216" r="24" fill="#FFD700"/><text x="86" y="225" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="24" font-weight="700" fill="#2B3A67">1</text><text x="122" y="212" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#2B3A67">Kekhawatiran</text><text x="72" y="284" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Keluarga, guru, atau anak menyampaikan contoh</text><text x="72" y="311" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">nyata.</text><path d="M588 301 l24 0 m-10 -10 l10 10 l-10 10" stroke="#00BCD4" stroke-width="4" fill="none"/><rect x="618" y="176" width="534" height="250" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/><circle cx="656" cy="216" r="24" fill="#FFD700"/><text x="656" y="225" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="24" font-weight="700" fill="#2B3A67">2</text><text x="692" y="212" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#2B3A67">Skrining</text><text x="642" y="284" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Tenaga kesehatan menggunakan alat yang sesuai</text><text x="642" y="311" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">bila diperlukan.</text><rect x="48" y="466" width="534" height="250" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/><circle cx="86" cy="506" r="24" fill="#FFD700"/><text x="86" y="515" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="24" font-weight="700" fill="#2B3A67">3</text><text x="122" y="502" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#2B3A67">Evaluasi</text><text x="72" y="574" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Tim menilai perkembangan, perilaku,</text><text x="72" y="601" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">komunikasi, dan fungsi.</text><path d="M588 591 l24 0 m-10 -10 l10 10 l-10 10" stroke="#00BCD4" stroke-width="4" fill="none"/><rect x="618" y="466" width="534" height="250" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/><circle cx="656" cy="506" r="24" fill="#FFD700"/><text x="656" y="515" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="24" font-weight="700" fill="#2B3A67">4</text><text x="692" y="502" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#2B3A67">Rencana</text><text x="642" y="574" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Keluarga dan profesional memilih layanan serta</text><text x="642" y="601" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">penyesuaian.</text>
<text x="1152" y="738" text-anchor="end" font-family="Poppins, Arial, sans-serif" font-size="18" fill="#7A84A3">Diagram: Tim YUKA (yukaindonesia.com)</text>
</svg>
