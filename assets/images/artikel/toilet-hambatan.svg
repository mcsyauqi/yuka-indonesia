<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Hambatan umum dan tanggapan pertama">
<rect width="1200" height="760" fill="#F7F8FC"/>
<rect width="1200" height="96" fill="#2B3A67"/>
<rect y="96" width="1200" height="6" fill="#FFD700"/>
<text x="48" y="58" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Hambatan umum dan tanggapan pertama</text>
<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="22" fill="#4A5578">Hentikan latihan dan hubungi tenaga kesehatan bila muncul nyeri atau darah</text>
<rect x="48" y="172" width="1104" height="56" fill="#2B3A67"/><text x="64" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Hambatan</text><text x="364" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Kemungkinan penyebab</text><text x="784" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Tanggapan pertama</text><rect x="48" y="228" width="1104" height="78" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Menolak masuk kamar mandi</text><text x="364" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Suara, bau, cahaya, atau pengalaman</text><text x="364" y="286" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">tidak nyaman</text><text x="784" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Kurangi pemicu, mulai dari pintu,</text><text x="784" y="286" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">beri waktu lebih panjang.</text><rect x="48" y="306" width="1104" height="78" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Mau duduk tapi tidak</text><text x="64" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">keluar</text><text x="364" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Posisi tidak stabil atau sembelit</text><text x="784" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Pakai pijakan kaki, periksa pola</text><text x="784" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">buang air besar.</text><rect x="48" y="384" width="1104" height="78" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Berhasil lalu mundur lagi</text><text x="364" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Perubahan rutinitas, sakit, atau</text><text x="364" y="442" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">kelelahan</text><text x="784" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Kembali ke tahap sebelumnya tanpa</text><text x="784" y="442" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">menyalahkan anak.</text><rect x="48" y="462" width="1104" height="78" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Bisa di rumah, tidak di</text><text x="64" y="520" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">sekolah</text><text x="364" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Keterampilan belum berpindah tempat</text><text x="784" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Samakan kata, jadwal, dan urutan</text><text x="784" y="520" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">langkah dengan guru.</text>
<text x="1152" y="738" text-anchor="end" font-family="Poppins, Arial, sans-serif" font-size="18" fill="#7A84A3">Diagram: Tim YUKA (yukaindonesia.com)</text>
</svg>
