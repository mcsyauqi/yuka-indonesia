<text x="48" y="58" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Tiga kelompok tanda kesiapan</text>
<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="22" fill="#4A5578">Rujukan: American Academy of Pediatrics, HealthyChildren</text>
<rect x="48" y="176" width="349.3333333333333" height="334" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="3"/><rect x="48" y="176" width="349.3333333333333" height="78" rx="18" fill="#2B3A67"/><rect x="48" y="226" width="349.3333333333333" height="28" fill="#2B3A67"/><text x="70" y="210" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Tubuh</text><circle cx="74" cy="285" r="6" fill="#2B3A67"/><text x="90" y="292" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Kering minimal dua jam atau</text><text x="90" y="318" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">setelah tidur siang</text><circle cx="74" cy="353" r="6" fill="#2B3A67"/><text x="90" y="360" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Menunjukkan tanda akan</text><text x="90" y="386" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">buang air</text><circle cx="74" cy="421" r="6" fill="#2B3A67"/><text x="90" y="428" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Bisa berjalan ke kamar</text><text x="90" y="454" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">mandi</text><rect x="425.3333333333333" y="176" width="349.3333333333333" height="334" rx="18" fill="#FFFFFF" stroke="#00838F" stroke-width="3"/><rect x="425.3333333333333" y="176" width="349.3333333333333" height="78" rx="18" fill="#00838F"/><rect x="425.3333333333333" y="226" width="349.3333333333333" height="28" fill="#00838F"/><text x="447.3333333333333" y="210" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Pemahaman</text><circle cx="451.3333333333333" cy="285" r="6" fill="#00838F"/><text x="467.3333333333333" y="292" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Mengikuti instruksi</text><text x="467.3333333333333" y="318" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">sederhana</text><circle cx="451.3333333333333" cy="353" r="6" fill="#00838F"/><text x="467.3333333333333" y="360" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Mengenali rasa basah dan</text><text x="467.3333333333333" y="386" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">kering</text><circle cx="451.3333333333333" cy="421" r="6" fill="#00838F"/><text x="467.3333333333333" y="428" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Bisa membuat rencana</text><text x="467.3333333333333" y="454" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">singkat dan mengingatnya</text><rect x="802.6666666666666" y="176" width="349.3333333333333" height="334" rx="18" fill="#FFFFFF" stroke="#7A5A06" stroke-width="3"/><rect x="802.6666666666666" y="176" width="349.3333333333333" height="78" rx="18" fill="#7A5A06"/><rect x="802.6666666666666" y="226" width="349.3333333333333" height="28" fill="#7A5A06"/><text x="824.6666666666666" y="210" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Kemauan</text><circle cx="828.6666666666666" cy="285" r="6" fill="#7A5A06"/><text x="844.6666666666666" y="292" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Tidak nyaman dengan popok</text><text x="844.6666666666666" y="318" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">basah</text><circle cx="828.6666666666666" cy="353" r="6" fill="#7A5A06"/><text x="844.6666666666666" y="360" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Meminta ke toilet atau</text><text x="844.6666666666666" y="386" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">menunjukkannya</text><circle cx="828.6666666666666" cy="421" r="6" fill="#7A5A06"/><text x="844.6666666666666" y="428" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Mau mencoba tanpa ditekan</text>
<text x="1152" y="738" text-anchor="end" font-family="Poppins, Arial, sans-serif" font-size="18" fill="#7A84A3">Diagram: Tim YUKA (yukaindonesia.com)</text>
