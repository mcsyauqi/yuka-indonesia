" font-weight="700" fill="#2B3A67" text-anchor="middle">digerakkan</text><rect x="680" y="350" width="150" height="300" rx="12" fill="#5C6BC0"/><circle cx="710" cy="380" r="18" fill="#FFD700"/><text x="710" y="387" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67" text-anchor="middle">5</text><text x="755" y="302" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B3A67" text-anchor="middle">Lampu</text><text x="755" y="324" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B3A67" text-anchor="middle">dinyalakan</text><rect x="838" y="290" width="150" height="360" rx="12" fill="#00BCD4"/><circle cx="868" cy="320" r="18" fill="#FFD700"/><text x="868" y="327" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67" text-anchor="middle">6</text><text x="913" y="242" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B3A67" text-anchor="middle">Membuka mulut</text><rect x="996" y="230" width="150" height="420" rx="12" fill="#2B3A67"/><circle cx="1026" cy="260" r="18" fill="#FFD700"/><text x="1026" y="267" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67" text-anchor="middle">7</text><text x="1071" y="182" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B3A67" text-anchor="middle">Gigi disentuh</text><text x="1071" y="204" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B3A67" text-anchor="middle">kaca mulut</text><text x="48" y="210" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="400" fill="#333B57" text-anchor="start">Naik satu anak tangga hanya bila anak sudah nyaman di tangga</text><text x="48" y="236" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="400" fill="#333B57" text-anchor="start">sebelumnya. Bisa butuh beberapa kali kunjungan.</text>
