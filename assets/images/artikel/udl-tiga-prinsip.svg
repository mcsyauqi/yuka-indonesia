tasi (apa yang</text><text x="447.3333333333333" y="238" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">dipelajari)</text><circle cx="451.3333333333333" cy="285" r="6" fill="#00838F"/><text x="467.3333333333333" y="292" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Sajikan materi lewat lebih</text><text x="467.3333333333333" y="318" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">dari satu indra</text><circle cx="451.3333333333333" cy="353" r="6" fill="#00838F"/><text x="467.3333333333333" y="360" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Jelaskan kosakata dan</text><text x="467.3333333333333" y="386" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">simbol</text><circle cx="451.3333333333333" cy="421" r="6" fill="#00838F"/><text x="467.3333333333333" y="428" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Kaitkan dengan pengetahuan</text><text x="467.3333333333333" y="454" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">awal</text><circle cx="451.3333333333333" cy="489" r="6" fill="#00838F"/><text x="467.3333333333333" y="496" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Tonjolkan pola dan gagasan</text><text x="467.3333333333333" y="522" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">utama</text><rect x="802.6666666666666" y="176" width="349.3333333333333" height="402" rx="18" fill="#FFFFFF" stroke="#C62828" stroke-width="3"/><rect x="802.6666666666666" y="176" width="349.3333333333333" height="78" rx="18" fill="#C62828"/><rect x="802.6666666666666" y="226" width="349.3333333333333" height="28" fill="#C62828"/><text x="824.6666666666666" y="210" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Aksi dan ekspresi</text><text x="824.6666666666666" y="238" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">(bagaimana menunjukkan)</text><circle cx="828.6666666666666" cy="285" r="6" fill="#C62828"/><text x="844.6666666666666" y="292" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Sediakan alat dan cara</text><text x="844.6666666666666" y="318" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">merespons yang mudah</text><text x="844.6666666666666" y="344" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">diakses</text><circle cx="828.6666666666666" cy="379" r="6" fill="#C62828"/><text x="844.6666666666666" y="386" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Izinkan beragam bentuk</text><text x="844.6666666666666" y="412" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">jawaban</text><circle cx="828.6666666666666" cy="447" r="6" fill="#C62828"/><text x="844.6666666666666" y="454" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Bantu menyusun tujuan dan</text><text x="844.6666666666666" y="480" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">rencana</text><circle cx="828.6666666666666" cy="515" r="6" fill="#C62828"/><text x="844.6666666666666" y="522" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Pantau kemajuan sendiri</text>
