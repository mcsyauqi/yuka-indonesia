<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Contoh dukungan berbasis kebutuhan">
<rect width="1200" height="760" fill="#F7F8FC"/>
<rect width="1200" height="96" fill="#2B3A67"/>
<rect y="96" width="1200" height="6" fill="#FFD700"/>
<text x="48" y="58" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Contoh dukungan berbasis kebutuhan</text>
<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="22" fill="#4A5578">Pilih strategi setelah memahami hambatan yang dialami anak</text>
<rect x="48" y="172" width="1104" height="56" fill="#2B3A67"/><text x="64" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Situasi</text><text x="304" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Dukungan yang mungkin dicoba</text><text x="824" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Cara memantau</text><rect x="48" y="228" width="1104" height="78" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Transisi</text><text x="304" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Jadwal visual, peringatan waktu, dan pilihan</text><text x="304" y="286" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">terbatas.</text><text x="824" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Catat durasi transisi dan</text><text x="824" y="286" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">tanda stres.</text><rect x="48" y="306" width="1104" height="78" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Instruksi</text><text x="304" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Kalimat singkat, contoh visual, dan waktu</text><text x="304" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">memproses.</text><text x="824" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Tanyakan apakah anak</text><text x="824" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">memahami, bukan hanya diam.</text><rect x="48" y="384" width="1104" height="78" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Sensorik</text><text x="304" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Kurangi pemicu, sediakan jeda, dan ajarkan</text><text x="304" y="442" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">cara meminta istirahat.</text><text x="824" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Pantau keamanan dan pemulihan</text><text x="824" y="442" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">setelah jeda.</text><rect x="48" y="462" width="1104" height="78" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Komunikasi</text><text x="304" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Gunakan cara bicara, gambar, tulisan, atau</text><text x="304" y="520" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">alat bantu yang sesuai.</text><text x="824" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Catat apakah anak lebih mampu</text><text x="824" y="520" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">menyampaikan kebutuhan.</text>
<text x="1152" y="738" text-anchor="end" font-family="Poppins, Arial, sans-serif" font-size="18" fill="#7A84A3">Diagram: Tim YUKA (yukaindonesia.com)</text>
</svg>
