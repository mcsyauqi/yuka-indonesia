<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Lakukan dan hindari">
<rect width="1200" height="760" fill="#F7F8FC"/>
<rect width="1200" height="96" fill="#2B3A67"/>
<rect y="96" width="1200" height="6" fill="#FFD700"/>
<text x="48" y="58" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Lakukan dan hindari</text>
<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="22" fill="#4A5578">Sikap orang dewasa yang membantu anak dengan mutisme selektif</text>
<rect x="48" y="172" width="1104" height="56" fill="#2B3A67"/><text x="64" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Situasi</text><text x="364" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Lakukan</text><text x="768" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Hindari</text><rect x="48" y="228" width="1104" height="78" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Anak diam saat ditanya</text><text x="364" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Beri waktu, tawarkan pilihan</text><text x="364" y="286" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">nonverbal</text><text x="768" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Mengulang pertanyaan sambil</text><text x="768" y="286" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">mendesak</text><rect x="48" y="306" width="1104" height="52" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Anak akhirnya bersuara</text><text x="364" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Tanggapi hangat tanpa kaget</text><text x="768" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Memuji heboh di depan orang banyak</text><rect x="48" y="358" width="1104" height="78" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="390" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Acara keluarga</text><text x="364" y="390" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Tetap datang, atur agar lebih</text><text x="364" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">nyaman</text><text x="768" y="390" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Menghindari semua acara</text><rect x="48" y="436" width="1104" height="52" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="468" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Di kelas</text><text x="364" y="468" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Sediakan cara lain untuk menjawab</text><text x="768" y="468" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Memaksa anak maju dan bicara</text><rect x="48" y="488" width="1104" height="52" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="520" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Membahas kondisinya</text><text x="364" y="520" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Akui bahwa bicara terasa sulit</text><text x="768" y="520" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Melabeli anak sombong atau bandel</text>
<text x="1152" y="738" text-anchor="end" font-family="Poppins, Arial, sans-serif" font-size="18" fill="#7A84A3">Diagram: Tim YUKA (yukaindonesia.com)</text>
</svg>
