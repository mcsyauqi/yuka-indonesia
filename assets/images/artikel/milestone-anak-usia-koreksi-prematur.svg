<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Diagram perhitungan usia koreksi: 4 bulan dikurangi 8 minggu sama dengan 2 bulan">
<rect width="1200" height="760" fill="#F7F8FC"/>
<rect width="1200" height="96" fill="#2B3A67"/>
<rect y="96" width="1200" height="6" fill="#FFD700"/>
<text x="48" y="60" font-family="Poppins, Arial, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="start">Menghitung usia koreksi bayi prematur</text>
<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="400" fill="#4A5578" text-anchor="start">Contoh yang dipakai American Academy of Pediatrics (AAP)</text>
<rect x="48" y="200" width="320" height="300" rx="20" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/><text x="208" y="250" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#2B3A67" text-anchor="middle">Usia sejak lahir</text><text x="208" y="380" font-family="Poppins, Arial, sans-serif" font-size="64" font-weight="700" fill="#2B3A67" text-anchor="middle">4 bulan</text><text x="208" y="440" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#2B3A67" text-anchor="middle">kira-kira 16 minggu</text><text x="208" y="464" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#2B3A67" text-anchor="middle">setelah lahir</text><text x="408" y="375" font-family="Poppins, Arial, sans-serif" font-size="64" font-weight="700" fill="#E53935" text-anchor="middle">−</text><rect x="440" y="200" width="320" height="300" rx="20" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/><text x="600" y="250" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#2B3A67" text-anchor="middle">Lahir lebih awal</text><text x="600" y="380" font-family="Poppins, Arial, sans-serif" font-size="64" font-weight="700" fill="#2B3A67" text-anchor="middle">8 minggu</text><text x="600" y="440" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#2B3A67" text-anchor="middle">lahir di usia kehamilan 32</text><text x="600" y="464" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#2B3A67" text-anchor="middle">minggu, cukup bulan 40</text><text x="600" y="488" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#2B3A67" text-anchor="middle">minggu</text><text x="800" y="375" font-family="Poppins, Arial, sans-serif" font-size="64" font-weight="700" fill="#E53935" text-anchor="middle">=</text><rect x="832" y="200" width="320" height="300" rx="20" fill="#2B3A67" stroke="#2B3A67" stroke-width="2"/><text x="992" y="250" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">Usia koreksi</text><text x="992" y="380" font-family="Poppins, Arial, sans-serif" font-size="64" font-weight="700" fill="#FFFFFF" text-anchor="middle">2 bulan</text><text x="992" y="440" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#FFFFFF" text-anchor="middle">kemampuannya dibandingkan</text><text x="992" y="464" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#FFFFFF" text-anchor="middle">dengan bayi cukup bulan</text><text x="992" y="488" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#FFFFFF" text-anchor="middle">usia 2 bulan</text><rect x="48" y="540" width="1104" height="120" rx="16" fill="#FFF8D6" stroke="#FFD700" stroke-width="2"/><text x="78" y="590" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="400" fill="#333B57" text-anchor="start">Rumus: usia sejak lahir dikurangi jumlah minggu kelahiran yang terlalu awal.</text><text x="78" y="622" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="400" fill="#333B57" text-anchor="start">AAP menyarankan usia koreksi dipakai selama dua tahun pertama.</text>
<text x="48" y="736" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="400" fill="#4A5578" text-anchor="start">Sumber: AAP HealthyChildren.org, Corrected Age For Preemies</text>
</svg>