333333333" cy="353" r="6" fill="#00838F"/><text x="467.3333333333333" y="360" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Ditulis pada hari yang sama</text><circle cx="451.3333333333333" cy="395" r="6" fill="#00838F"/><text x="467.3333333333333" y="402" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Fakta dulu, tafsiran</text><text x="467.3333333333333" y="428" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">kemudian</text><circle cx="451.3333333333333" cy="463" r="6" fill="#00838F"/><text x="467.3333333333333" y="470" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Berguna untuk perilaku dan</text><text x="467.3333333333333" y="496" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">sosial</text><rect x="802.6666666666666" y="176" width="349.3333333333333" height="376" rx="18" fill="#FFFFFF" stroke="#7A5A06" stroke-width="3"/><rect x="802.6666666666666" y="176" width="349.3333333333333" height="78" rx="18" fill="#7A5A06"/><rect x="802.6666666666666" y="226" width="349.3333333333333" height="28" fill="#7A5A06"/><text x="824.6666666666666" y="210" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Rubrik dan daftar cek</text><circle cx="828.6666666666666" cy="285" r="6" fill="#7A5A06"/><text x="844.6666666666666" y="292" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Kriteria ditulis sebelum</text><text x="844.6666666666666" y="318" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">menilai</text><circle cx="828.6666666666666" cy="353" r="6" fill="#7A5A06"/><text x="844.6666666666666" y="360" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Level dari mulai sampai</text><text x="844.6666666666666" y="386" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">mandiri</text><circle cx="828.6666666666666" cy="421" r="6" fill="#7A5A06"/><text x="844.6666666666666" y="428" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Dipakai berulang dengan</text><text x="844.6666666666666" y="454" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">kriteria sama</text><circle cx="828.6666666666666" cy="489" r="6" fill="#7A5A06"/><text x="844.6666666666666" y="496" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Mudah dipahami anak</text>
