<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Enam fase PECS secara ringkas">
<rect width="1200" height="760" fill="#F7F8FC"/>
<rect width="1200" height="96" fill="#2B3A67"/>
<rect y="96" width="1200" height="6" fill="#FFD700"/>
<text x="48" y="58" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Enam fase PECS secara ringkas</text>
<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="22" fill="#4A5578">Urutan mengajarkan pertukaran gambar sampai komentar spontan</text>
<rect x="48" y="172" width="1104" height="56" fill="#2B3A67"/><text x="64" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Fase</text><text x="184" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Fokus belajar</text><text x="604" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Contoh kemampuan</text><rect x="48" y="228" width="1104" height="52" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">I</text><text x="184" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Cara berkomunikasi</text><text x="604" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Menukar satu gambar dengan benda yang diinginkan</text><rect x="48" y="280" width="1104" height="52" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="312" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">II</text><text x="184" y="312" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Jarak dan ketekunan</text><text x="604" y="312" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Mencari buku komunikasi dan pasangan komunikasi</text><rect x="48" y="332" width="1104" height="52" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">III</text><text x="184" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Diskriminasi gambar</text><text x="604" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Memilih gambar yang sesuai dari beberapa pilihan</text><rect x="48" y="384" width="1104" height="52" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">IV</text><text x="184" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Struktur kalimat</text><text x="604" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Menyusun gambar pada strip kalimat</text><rect x="48" y="436" width="1104" height="52" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="468" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">V</text><text x="184" y="468" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Menjawab permintaan</text><text x="604" y="468" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Menjawab pertanyaan tentang keinginan</text><rect x="48" y="488" width="1104" height="52" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="520" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">VI</text><text x="184" y="520" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Komentar</text><text x="604" y="520" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Menggunakan awal kalimat untuk berbagi pengamatan</text>
<text x="1152" y="738" text-anchor="end" font-family="Poppins, Arial, sans-serif" font-size="18" fill="#7A84A3">Diagram: Tim YUKA (yukaindonesia.com)</text>
</svg>
