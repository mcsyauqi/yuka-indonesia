<text x="48" y="58" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Bahasa reseptif dan ekspresif</text>
<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="22" fill="#4A5578">Contoh kesulitan menurut MedlinePlus dan ASHA</text>
<rect x="48" y="176" width="538" height="298" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="3"/><rect x="48" y="176" width="538" height="78" rx="18" fill="#2B3A67"/><rect x="48" y="226" width="538" height="28" fill="#2B3A67"/><text x="70" y="210" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Reseptif (memahami)</text><circle cx="74" cy="285" r="6" fill="#2B3A67"/><text x="90" y="292" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Sulit mengerti ucapan orang lain</text><circle cx="74" cy="327" r="6" fill="#2B3A67"/><text x="90" y="334" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Sulit mengikuti perintah</text><circle cx="74" cy="369" r="6" fill="#2B3A67"/><text x="90" y="376" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Sulit mengenali gambar dan gestur</text><circle cx="74" cy="411" r="6" fill="#2B3A67"/><text x="90" y="418" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Sulit menjawab pertanyaan</text><rect x="614" y="176" width="538" height="298" rx="18" fill="#FFFFFF" stroke="#2B3A67" stroke-width="3"/><rect x="614" y="176" width="538" height="78" rx="18" fill="#2B3A67"/><rect x="614" y="226" width="538" height="28" fill="#2B3A67"/><text x="636" y="210" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Ekspresif (menyampaikan)</text><circle cx="640" cy="285" r="6" fill="#2B3A67"/><text x="656" y="292" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Sulit merangkai kata jadi kalimat</text><circle cx="640" cy="327" r="6" fill="#2B3A67"/><text x="656" y="334" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Kosakata di bawah teman sebaya</text><circle cx="640" cy="369" r="6" fill="#2B3A67"/><text x="656" y="376" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Sering lupa kata yang tepat</text><circle cx="640" cy="411" r="6" fill="#2B3A67"/><text x="656" y="418" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Salah memakai bentuk waktu</text>
