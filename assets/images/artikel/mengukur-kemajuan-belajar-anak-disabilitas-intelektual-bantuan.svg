<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Tingkat bantuan sebagai ukuran kemajuan">
<rect width="1200" height="760" fill="#F7F8FC"/>
<rect width="1200" height="96" fill="#2B3A67"/>
<rect y="96" width="1200" height="6" fill="#FFD700"/>
<text x="48" y="58" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Tingkat bantuan sebagai ukuran kemajuan</text>
<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="22" fill="#4A5578">Makin sedikit bantuan yang dibutuhkan, makin mandiri anak</text>
<rect x="48" y="172" width="1104" height="56" fill="#2B3A67"/><text x="64" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Tingkat</text><text x="304" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Bentuk bantuan</text><text x="754" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Contoh saat mengisi air</text><rect x="48" y="228" width="1104" height="78" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Fisik penuh</text><text x="304" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Tangan pendamping menuntun seluruh</text><text x="304" y="286" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">gerakan</text><text x="754" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Tangan anak dipandu menekan keran</text><rect x="48" y="306" width="1104" height="78" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Fisik sebagian</text><text x="304" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Sentuhan ringan di siku atau</text><text x="304" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">pergelangan</text><text x="754" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Siku anak didorong pelan ke arah</text><text x="754" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">keran</text><rect x="48" y="384" width="1104" height="78" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Contoh</text><text x="304" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Pendamping memperagakan lebih dulu</text><text x="754" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Pendamping menekan keran, anak</text><text x="754" y="442" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">meniru</text><rect x="48" y="462" width="1104" height="52" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Lisan</text><text x="304" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Petunjuk dengan kata-kata</text><text x="754" y="494" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">"Tekan keran biru"</text><rect x="48" y="514" width="1104" height="52" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="546" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Isyarat</text><text x="304" y="546" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Tunjukan atau gambar</text><text x="754" y="546" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Pendamping menunjuk keran</text><rect x="48" y="566" width="1104" height="78" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="598" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Mandiri</text><text x="304" y="598" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Tanpa bantuan</text><text x="754" y="598" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Anak mengisi air sendiri sampai</text><text x="754" y="624" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">selesai</text>
<text x="1152" y="738" text-anchor="end" font-family="Poppins, Arial, sans-serif" font-size="18" fill="#7A84A3">Diagram: Tim YUKA (yukaindonesia.com)</text>
</svg>
