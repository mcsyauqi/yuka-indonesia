<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Alur tiga langkah memantau milestone dan kapan membicarakannya dengan tenaga kesehatan">
<rect width="1200" height="760" fill="#F7F8FC"/>
<rect width="1200" height="96" fill="#2B3A67"/>
<rect y="96" width="1200" height="6" fill="#FFD700"/>
<text x="48" y="60" font-family="Poppins, Arial, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="start">Kapan orang tua perlu bertindak</text>
<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="400" fill="#4A5578" text-anchor="start">Alur sederhana memakai milestone tanpa panik dan tanpa menunda</text>
<rect x="48" y="180" width="330" height="200" rx="16" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/>
<circle cx="84" cy="218" r="22" fill="#FFD700"/><text x="84" y="226" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="700" fill="#2B3A67" text-anchor="middle">1</text>
<text x="118" y="214" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B3A67" text-anchor="start">Amati sehari-hari</text>
<text x="72" y="278" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#333B57" text-anchor="start">Saat makan, mandi, dan</text><text x="72" y="302" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#333B57" text-anchor="start">bermain. Tidak perlu</text><text x="72" y="326" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#333B57" text-anchor="start">menguji anak secara</text><text x="72" y="350" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#333B57" text-anchor="start">khusus.</text><rect x="436" y="180" width="330" height="200" rx="16" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/>
<circle cx="472" cy="218" r="22" fill="#FFD700"/><text x="472" y="226" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="700" fill="#2B3A67" text-anchor="middle">2</text>
<text x="506" y="214" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B3A67" text-anchor="start">Catat tanggal</text>
<text x="460" y="278" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#333B57" text-anchor="start">Tulis kapan kemampuan</text><text x="460" y="302" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#333B57" text-anchor="start">muncul dan dalam situasi</text><text x="460" y="326" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#333B57" text-anchor="start">apa. Video pendek</text><text x="460" y="350" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#333B57" text-anchor="start">membantu.</text><rect x="824" y="180" width="330" height="200" rx="16" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/>
<circle cx="860" cy="218" r="22" fill="#FFD700"/><text x="860" y="226" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="700" fill="#2B3A67" text-anchor="middle">3</text>
<text x="894" y="214" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B3A67" text-anchor="start">Cek tanda</text>
<text x="848" y="278" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#333B57" text-anchor="start">Belum capai milestone,</text><text x="848" y="302" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#333B57" text-anchor="start">kemampuan hilang, atau</text><text x="848" y="326" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#333B57" text-anchor="start">orang tua khawatir?</text><path d="M384 280 h44 m-12 -12 l12 12 l-12 12" stroke="#00BCD4" stroke-width="4" fill="none"/><path d="M772 280 h44 m-12 -12 l12 12 l-12 12" stroke="#00BCD4" stroke-width="4" fill="none"/><path d="M989 386 v40 h-320 v30" stroke="#E53935" stroke-width="4" fill="none"/><path d="M657 446 l12 12 l12 -12" stroke="#E53935" stroke-width="4" fill="none"/><text x="1000" y="420" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#E53935" text-anchor="start">Ya</text><rect x="436" y="466" width="466" height="180" rx="16" fill="#2B3A67"/><text x="466" y="506" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFD700" text-anchor="start">Jangan menunggu</text><text x="466" y="542" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="400" fill="#FFFFFF" text-anchor="start">Bicarakan dengan dokter anak, bidan, atau</text><text x="466" y="568" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="400" fill="#FFFFFF" text-anchor="start">puskesmas. Minta skrining perkembangan (buku</text><text x="466" y="594" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="400" fill="#FFFFFF" text-anchor="start">KIA, KPSP). Bila perlu, evaluasi lanjut dan</text><text x="466" y="620" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="400" fill="#FFFFFF" text-anchor="start">intervensi dini.</text><rect x="48" y="466" width="330" height="180" rx="16" fill="#FFFFFF" stroke="#00BCD4" stroke-width="2"/><text x="72" y="506" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#2B3A67" text-anchor="start">Tidak ada tanda</text><text x="72" y="542" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#333B57" text-anchor="start">Lanjutkan pemantauan berkala.</text><text x="72" y="567" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#333B57" text-anchor="start">Perkembangan terus berlangsung,</text><text x="72" y="592" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#333B57" text-anchor="start">jadi tetap periksa sesuai</text><text x="72" y="617" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#333B57" text-anchor="start">jadwal.</text><rect x="930" y="466" width="224" height="180" rx="16" fill="#FFF8D6" stroke="#FFD700" stroke-width="2"/><text x="950" y="506" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="600" fill="#333B57" text-anchor="start">Kemampuan yang</text><text x="950" y="532" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="600" fill="#333B57" text-anchor="start">hilang selalu perlu</text><text x="950" y="558" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="600" fill="#333B57" text-anchor="start">segera dibicarakan.</text>
<text x="48" y="736" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="400" fill="#4A5578" text-anchor="start">Sumber: CDC Learn the Signs. Act Early.; IDAI, Mengenal Keterlambatan Perkembangan Umum</text>
</svg>