<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Tujuh langkah menyiapkan anak autis ke dokter gigi">
<rect width="1200" height="760" fill="#F7F8FC"/>
<rect width="1200" height="96" fill="#2B3A67"/>
<rect y="96" width="1200" height="6" fill="#FFD700"/>
<text x="48" y="60" font-family="Poppins, Arial, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="start">7 langkah menyiapkan kunjungan ke dokter gigi</text>
<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="400" fill="#4A5578" text-anchor="start">Persiapan bertahap untuk anak autis, dikerjakan orang tua bersama klinik</text>
<rect x="48" y="176" width="258" height="238" rx="16" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/>
<circle cx="84" cy="214" r="22" fill="#FFD700"/><text x="84" y="222" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="700" fill="#2B3A67" text-anchor="middle">1</text>
<text x="118" y="210" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B3A67" text-anchor="start">Buat profil</text><text x="118" y="235" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B3A67" text-anchor="start">singkat</text>
<text x="72" y="274" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#333B57" text-anchor="start">Cara komunikasi,</text><text x="72" y="298" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#333B57" text-anchor="start">pemicu panik, sentuhan</text><text x="72" y="322" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#333B57" text-anchor="start">yang diterima, obat</text><text x="72" y="346" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#333B57" text-anchor="start">rutin.</text><rect x="330" y="176" width="258" height="238" rx="16" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/>
<circle cx="366" cy="214" r="22" fill="#FFD700"/><text x="366" y="222" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="700" fill="#2B3A67" text-anchor="middle">2</text>
<text x="400" y="210" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B3A67" text-anchor="start">Cerita bergambar</text>
<text x="354" y="274" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#333B57" text-anchor="start">Urutan kunjungan dari</text><text x="354" y="298" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#333B57" text-anchor="start">datang sampai pulang,</text><text x="354" y="322" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#333B57" text-anchor="start">pakai foto klinik bila</text><text x="354" y="346" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#333B57" text-anchor="start">ada.</text><rect x="612" y="176" width="258" height="238" rx="16" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/>
<circle cx="648" cy="214" r="22" fill="#FFD700"/><text x="648" y="222" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="700" fill="#2B3A67" text-anchor="middle">3</text>
<text x="682" y="210" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B3A67" text-anchor="start">Latihan lewat</text><text x="682" y="235" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B3A67" text-anchor="start">bermain</text>
<text x="636" y="274" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#333B57" text-anchor="start">Main dokter gigi di</text><text x="636" y="298" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#333B57" text-anchor="start">rumah: hitung gigi</text><text x="636" y="322" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#333B57" text-anchor="start">sambil menyorot senter</text><text x="636" y="346" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#333B57" text-anchor="start">kecil.</text><rect x="894" y="176" width="258" height="238" rx="16" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/>
<circle cx="930" cy="214" r="22" fill="#FFD700"/><text x="930" y="222" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="700" fill="#2B3A67" text-anchor="middle">4</text>
<text x="964" y="210" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B3A67" text-anchor="start">Kunjungan</text><text x="964" y="235" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B3A67" text-anchor="start">perkenalan</text>
<text x="918" y="274" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#333B57" text-anchor="start">Kenalkan ruang,</text><text x="918" y="298" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#333B57" text-anchor="start">petugas, dan alat</text><text x="918" y="322" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#333B57" text-anchor="start">bertahap tanpa</text><text x="918" y="346" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#333B57" text-anchor="start">tindakan.</text><rect x="189" y="438" width="258" height="238" rx="16" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/>
<circle cx="225" cy="476" r="22" fill="#FFD700"/><text x="225" y="484" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="700" fill="#2B3A67" text-anchor="middle">5</text>
<text x="259" y="472" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B3A67" text-anchor="start">Jadwal dan ruang</text><text x="259" y="497" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B3A67" text-anchor="start">sama</text>
<text x="213" y="536" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#333B57" text-anchor="start">Petugas, ruang</text><text x="213" y="560" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#333B57" text-anchor="start">praktik, dan jam janji</text><text x="213" y="584" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#333B57" text-anchor="start">yang sama setiap kali.</text><rect x="471" y="438" width="258" height="238" rx="16" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/>
<circle cx="507" cy="476" r="22" fill="#FFD700"/><text x="507" y="484" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="700" fill="#2B3A67" text-anchor="middle">6</text>
<text x="541" y="472" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B3A67" text-anchor="start">Siapkan tas</text><text x="541" y="497" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B3A67" text-anchor="start">kunjungan</text>
<text x="495" y="536" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#333B57" text-anchor="start">Benda kesayangan,</text><text x="495" y="560" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#333B57" text-anchor="start">penutup telinga,</text><text x="495" y="584" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#333B57" text-anchor="start">kacamata hitam, kartu</text><text x="495" y="608" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#333B57" text-anchor="start">jadwal.</text><rect x="753" y="438" width="258" height="238" rx="16" fill="#FFFFFF" stroke="#2B3A67" stroke-width="2"/>
<circle cx="789" cy="476" r="22" fill="#FFD700"/><text x="789" y="484" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="700" fill="#2B3A67" text-anchor="middle">7</text>
<text x="823" y="472" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B3A67" text-anchor="start">Tutup dengan</text><text x="823" y="497" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="700" fill="#2B3A67" text-anchor="start">senang</text>
<text x="777" y="536" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#333B57" text-anchor="start">Pujian spesifik dan</text><text x="777" y="560" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#333B57" text-anchor="start">hadiah yang bukan</text><text x="777" y="584" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="400" fill="#333B57" text-anchor="start">makanan manis.</text>
<text x="48" y="736" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="400" fill="#4A5578" text-anchor="start">Disusun dari NIDCR, Practical Oral Care for People With Autism, dan pedoman AAPD Behavior Guidance</text>
</svg>