<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Apraksia bicara, speech delay, dan disartria">
<rect width="1200" height="760" fill="#F7F8FC"/>
<rect width="1200" height="96" fill="#2B3A67"/>
<rect y="96" width="1200" height="6" fill="#FFD700"/>
<text x="48" y="58" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Apraksia bicara, speech delay, dan disartria</text>
<text x="48" y="142" font-family="Poppins, Arial, sans-serif" font-size="22" fill="#4A5578">Rangkuman perbedaan menurut NIDCD dan ASHA</text>
<rect x="48" y="172" width="1104" height="56" fill="#2B3A67"/><text x="64" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Kondisi</text><text x="394" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Inti masalah</text><text x="794" y="208" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Gambaran bicara</text><rect x="48" y="228" width="1104" height="78" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Apraksia bicara pada anak</text><text x="394" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Otak sulit merencanakan dan</text><text x="394" y="286" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">mengurutkan gerakan bicara</text><text x="794" y="260" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Kesalahan tidak konsisten,</text><text x="794" y="286" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">meraba-raba mencari bunyi</text><rect x="48" y="306" width="1104" height="78" fill="#FFFFFF" stroke="#D5DAE8"/><text x="64" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Keterlambatan bicara</text><text x="394" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Perkembangan bicara biasa tetapi</text><text x="394" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">lebih lambat</text><text x="794" y="338" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Mengikuti tahapan yang biasa,</text><text x="794" y="364" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">hanya lebih lambat</text><rect x="48" y="384" width="1104" height="78" fill="#EEF1F8" stroke="#D5DAE8"/><text x="64" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" font-weight="700" fill="#2B3A67">Disartria</text><text x="394" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Otot rahang, lidah, atau bibir</text><text x="394" y="442" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">lemah atau lumpuh</text><text x="794" y="416" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Bicara kurang jelas karena</text><text x="794" y="442" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">kelemahan otot bicara</text>
<text x="1152" y="738" text-anchor="end" font-family="Poppins, Arial, sans-serif" font-size="18" fill="#7A84A3">Diagram: Tim YUKA (yukaindonesia.com)</text>
</svg>
