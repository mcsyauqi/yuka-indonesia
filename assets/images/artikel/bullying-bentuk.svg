"373" y="386" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">atau cara jalan</text><circle cx="357" cy="421" r="6" fill="#00838F"/><text x="373" y="428" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Mengancam akan</text><text x="373" y="454" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">menyakiti</text><rect x="614" y="176" width="255" height="360" rx="18" fill="#FFFFFF" stroke="#7A5A06" stroke-width="3"/><rect x="614" y="176" width="255" height="78" rx="18" fill="#7A5A06"/><rect x="614" y="226" width="255" height="28" fill="#7A5A06"/><text x="636" y="210" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Relasional</text><circle cx="640" cy="285" r="6" fill="#7A5A06"/><text x="656" y="292" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Menyebarkan rumor</text><circle cx="640" cy="327" r="6" fill="#7A5A06"/><text x="656" y="334" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Mengeluarkan anak</text><text x="656" y="360" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">dari kelompok</text><circle cx="640" cy="395" r="6" fill="#7A5A06"/><text x="656" y="402" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Mengatur teman lain</text><text x="656" y="428" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">agar menjauh</text><rect x="897" y="176" width="255" height="360" rx="18" fill="#FFFFFF" stroke="#B3261E" stroke-width="3"/><rect x="897" y="176" width="255" height="78" rx="18" fill="#B3261E"/><rect x="897" y="226" width="255" height="28" fill="#B3261E"/><text x="919" y="210" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Daring dan barang</text><circle cx="923" cy="285" r="6" fill="#B3261E"/><text x="939" y="292" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Pesan atau unggahan</text><text x="939" y="318" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">yang merendahkan</text><circle cx="923" cy="353" r="6" fill="#B3261E"/><text x="939" y="360" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Menyebar foto tanpa</text><text x="939" y="386" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">izin</text><circle cx="923" cy="421" r="6" fill="#B3261E"/><text x="939" y="428" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">Merusak atau</text><text x="939" y="454" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">menyembunyikan</text><text x="939" y="480" font-family="Poppins, Arial, sans-serif" font-size="19" fill="#333B57">barang</text>
